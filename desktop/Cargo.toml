[workspace]
resolver = "2"
members = [
  "crates/app",
  "crates/account",
  "crates/events",
  "crates/courses",
  "crates/companion",
  "crates/platform",
  "crates/platform-os",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.92"

[workspace.dependencies]
gpui-kit = "0.7.3"
cgc-account = { path = "crates/account" }
cgc-events = { path = "crates/events" }
cgc-courses = { path = "crates/courses" }
cgc-companion = { path = "crates/companion" }
cgc-platform = { path = "crates/platform" }
cgc-platform-os = { path = "crates/platform-os" }
