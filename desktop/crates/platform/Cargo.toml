[package]
name = "cgc-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde_json = "1"
ed25519-dalek = "2.1"
base64 = "0.22"
sha2 = "0.10"
agent-client-protocol = { version = "3.4", features = ["process"] }
futures = "0.3"
ureq = { version = "3.4", features = ["json"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
