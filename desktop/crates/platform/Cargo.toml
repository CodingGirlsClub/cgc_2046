[package]
name = "cgc-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde_json = "1"
ed25519-dalek = "2.1"
base64 = "0.22"
sha2 = "0.10"
agent-client-protocol = { version = "3.4", features = ["process"] }
futures = "0.3"
ureq = { version = "3.4", features = ["json"] }
interprocess = "2.4"
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
png = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
