[package]
name = "cgc-desktop-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde_json = "1"
ratex-gpui = { version = "0.4", default-features = false }
gpui-kit.workspace = true
# story 3.13：二维码矩阵生成。qrcode 0.14.1，license = MIT OR Apache-2.0（AGPL-3.0 兼容）。
# 关闭默认 features（image/svg/pic）：只需要矩阵，不引入 image 等额外依赖。
qrcode = { version = "0.14.1", default-features = false }
cgc-account.workspace = true
cgc-agent-chat.workspace = true
cgc-courses.workspace = true
cgc-events.workspace = true
cgc-platform.workspace = true

# cargo-packager 配置（story 1.13）；格式由 CI 的 --formats 指定（dmg / wix / deb,appimage）。
# 未签名产物：签名与公证归 epic-6（ADR-0027 决策 2/3）。
[package.metadata.packager]
productName = "程序媛汇"
identifier = "com.codinggirlsclub.cgc2046.desktop"
description = "程序媛汇学员端桌面客户端"
longDescription = "程序媛汇学员端桌面客户端：工作台、场次报名与支付、课程学习，以及与你自己本机 agent 的学习搭子对话。"
category = "Education"
outDir = "../../dist"  # 相对本 Cargo.toml（crates/app）→ desktop/dist
beforePackagingCommand = "cargo build --release -p cgc-desktop-app"
icons = [
  "icons/32x32.png",
  "icons/128x128.png",
  "icons/128x128@2x.png",
  "icons/icon.icns",
  "icons/icon.ico",
]

# Linux deb 运行时依赖：登录凭证通过 secret-tool（libsecret）持久化。
[package.metadata.packager.deb]
depends = ["libsecret-tools"]
