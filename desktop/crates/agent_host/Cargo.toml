[package]
name = "cgc-agent-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
cgc-agent-conversation.workspace = true
cgc-agent-core.workspace = true
cgc-agent-provider.workspace = true
cgc-agent-tools.workspace = true
# ACP SDK：native 进程内 server（Agent 角色 + 内存 Channel transport）。
agent-client-protocol = { version = "3.4" }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# 端到端测试：native server ↔ platform 现有 ACP 客户端 ingestion。
cgc-platform.workspace = true
futures = "0.3"
