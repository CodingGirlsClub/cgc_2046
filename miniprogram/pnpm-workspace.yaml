allowBuilds:
  '@tarojs/cli': true
# P0-2/#2 修复：Taro 小红书插件 1.2.2 的 onShareChat 注入缺少 onShareAppMessage
# 配对（全页 mount 平台 RUNTIME ERROR，审核风险）——patch 成对注入。
# 注意：patchedDependencies 是 pnpm 的设置项，读自本文件（pnpm 10/11）；
# 删掉会让 frozen install 报 ERR_PNPM_LOCKFILE_CONFIG_MISMATCH。
patchedDependencies:
  '@tarojs/plugin-platform-xhs@1.2.2': patches/@tarojs__plugin-platform-xhs@1.2.2.patch
# #1022：修补 fast-uri URI authority 注入、未闭合括号主机混淆及主机大小写归一化公告。
# @tarojs/taro > webpack > schema-utils > ajv 的 3.x 传递依赖，BSD-3-Clause。
# 3.1.8 是已修复的补丁版；沿用既有 override，避免锁文件继续解析到 3.1.6。
# 上游解析自然收敛到修复版且审计通过后可移除此 override。
overrides:
  "fast-uri@>=3.0.0 <3.1.9": 3.1.9
  # GHSA-qhr7-859c-m2p7 / GHSA-6j4f-fj2g-mc7p：1.x 递归 DoS 补丁。
  "brace-expansion@>=1.0.0 <1.1.21": 1.1.21
  # GHSA-g84c-rxfj-3j2c：5.x 无修复版，使用上游 7.4.6 路径边界修复。
  # Node >=18.12（CI 用 24）；tests/dev-middleware-security.test.mjs 经 Taro 的
  # webpack-dev-server 验证打包/HTTP/关闭及越界拒绝。上游解析不再命中旧版本后可移除。
  "webpack-dev-middleware@>=5.0.0 <7.4.6": 7.4.6
  # 2026-09-15：GHSA-w27v-7q3p-w38r（svgo removeScripts 命名空间/控制字符绕过，
  # high）——@tarojs/taro>webpack>terser-webpack-plugin>cssnano>postcss-svgo>
  # svgo 传递链，lockfile 锁 3.3.4，3.3.5 为补丁版本（postcss-svgo range ^3
  # 兼容）。同 fast-uri 先例：overrides 强制收敛，构建期工具无运行时面。
  "svgo@>=3.0.0 <3.3.5": 3.3.5
  # 2026-09-24：Dependabot critical/high 传递链收敛（js-yaml 3 条 high、
  # minimist 1 条 critical、glob 1 条 high、postcss 2 条 high）。
  # - js-yaml CVE-2026-59870 CPU 消耗（eslint/@eslint/eslintrc 等工具链，
  #   lock 锁 4.3.0/4.3.1，4.3.2 为补丁版本，range ^4 兼容）。
  # - minimist 原型污染：mkdirp@0.5.1 精确锁 0.0.8，无 range 可解析——
  #   overrides 强制替换；argv 解析 API 1.x 向下兼容。
  # - glob 命令注入（GHSA 面在 glob CLI 的 -c 参数，本项目仅库用法）：
  #   @tarojs/plugin-doctor 锁 10.2.6，10.5.0 为补丁版本；glob@7 老链
  #   （rimraf 3）不受本 range 命中，不误伤。
  # - postcss@7（miniprogram-simulate 测试工具链）7 线无修复版：强制升
  #   8.5.26（lock 内已有版本）。若单测暴露 postcss 8 插件 API 不兼容，
  #   回退本条并在 auditConfig 记豁免。均构建/测试期依赖，无运行时面。
  "js-yaml@>=4.0.0 <4.3.2": 4.3.2
  "minimist@<0.2.4": 1.2.8
  "glob@>=10.2.0 <10.5.0": 10.5.0
  "postcss@7": 8.5.26
  # 2026-10-17：Taro webpack-dev-server / postcss 传递链的 4 条新公告收敛。
  # 全部同 major 补丁位，API 无破坏；均构建期工具链，无运行时面。
  # - GHSA-jqcg-44mw-7w3h（proxy-addr IP 伪造，critical）：express 传递依赖，
  #   2.0.7 → 2.0.8（2.x 内补丁）。
  # - GHSA-pqg4-j6r4-53mv（shell-quote 命令注入，critical）：launch-editor
  #   传递依赖，1.10.0 → 1.11.0（1.x 内补丁）。
  # - GHSA-68fv-2mgg-jv7q（source-map-js 事件循环 DoS，high）：postcss 传递依赖，
  #   1.2.1 → 1.2.2（1.x 内补丁）。
  # - GHSA-vc2v-76pw-4v95（compression 内存泄漏 DoS，high）：1.8.1 → 1.8.2。
  # 上游解析自然收敛到补丁版后各条可逐一移除。
  "proxy-addr@>=1.1.0 <2.0.8": 2.0.8
  "shell-quote@>=1.8.4 <1.11.0": 1.11.0
  "source-map-js@>=1.0.0 <1.2.2": 1.2.2
  "compression@<1.8.2": 1.8.2
  # 2026-10-29：@tarojs/taro > webpack-dev-server 构建期传递链的 4 条新 high
  # 公告收敛（audit 数据库当日更新触发，develop push 的 miniprogram required
  # check 因此变红）。全部同 major 补丁位，仅构建期工具链、无运行时面；
  # 上游解析自然收敛到补丁版后可逐条移除。
  # - GHSA-q3jh-wrc6-jgq8 / GHSA-8r9p-f939-6h3c（follow-redirects array-form
  #   headers bypass、sensitiveHeaders 正则转义）：http-proxy 传递依赖，
  #   1.16.0 → 1.16.1。
  # - GHSA-587h-7wmj-h5pm（launch-editor fs.existsSync 存在性检查可绕过）：
  #   2.14.1 → 2.14.2。
  # - GHSA-27r3-jxmh-p828（body-parser 压缩请求尾字节 DoS）：express 传递依赖，
  #   1.20.6 → 1.20.9。
  "follow-redirects@>=1.16.0 <1.16.1": 1.16.1
  "launch-editor@<=2.14.1": 2.14.2
  "body-parser@<1.20.9": 1.20.9
  # 2026-10-29：Dependabot critical 收敛（vm2 一条依赖累计 19+ 条公告）。
  # - vm2（GHSA-pq68-rvw4-xp4r 等 19 条，3.12.2 为当前修复版）：路径
  #   @tarojs/webpack5-runner>vm2，仅用于 Taro prerender 的 NodeVM，
  #   本项目未启用 prerender，且 3.12.x 与 ^3.9.19 同 major、API 兼容。
  # - swiper 原型污染（GHSA-hmx5-qpq5-p643，12.1.2 修复）：Taro 上游
  #   @tarojs/components 精确锁 11.1.15，跨大版本 override；weapp/tt/xhs
  #   产物不打包 npm swiper（映射平台原生组件），仅 H5 使用，需三端构建验证。
  "vm2@<3.12.2": 3.12.2
  "swiper@<12.1.2": 12.1.2
  # 2026-10-29：Dependabot high 收敛。全部为开发/构建工具链（GraphQL codegen、
  # Taro CLI、webpack runner），无小程序运行面；同 major 补丁位优先，
  # @graphql-tools/utils 与 serialize-javascript 为跨 major 但 API 兼容，
  # 由 codegen/三端构建/单测验证。
  # - @fastify/busboy 3.2.0 → 3.2.1：GHSA-xjh9-v7x6-24jw（multipart boundary DoS）
  # - @graphql-tools/executor-legacy-ws 1.1.32 → 1.1.36：
  #   GHSA-6fw5-9hq8-w87g（TLS 校验关闭）、GHSA-434m-5hcj-pxf3（WebSocket 参数串用户）
  # - @graphql-tools/utils 11.2.2 → 12.0.2：
  #   GHSA-7mx3-vvmw-hjmv（mergeDeep 原型污染）、GHSA-c4qx-w738-7hr3
  # - axios 1.19.0 → 1.20.0：GHSA-3pq3-5fj3-cg6v 等 4 条（HTTP/2 代理绕过、SSRF 等）
  # - adm-zip 0.5.18 → 0.6.1：GHSA-xcpc-8h2w-3j85 等 3 条（解压内存/SUID）
  # - serialize-javascript 6.0.2 → 7.0.3：GHSA-5c6j-r48x-rmvq（RegExp/Date RCE）
  # - vite 8.2.1 → 8.2.4：GHSA-587h-7wmj-h5pm（launch-editor Windows 路径检查）
  "@fastify/busboy@<3.2.2": 3.2.2
  "@graphql-tools/executor-legacy-ws@<1.1.36": 1.1.36
  "@graphql-tools/utils@<12.0.2": 12.0.2
  "axios@<1.20.0": 1.20.0
  "adm-zip@<0.6.1": 0.6.1
  "serialize-javascript@<7.1.3": 7.1.3
  "vite@<8.2.4": 8.2.4
  # 2026-10-29：pnpm audit 全量剩余 high 收敛（不在 Dependabot 清单内，
  # 均为开发/构建期工具链）：
  # - jpeg-js <0.4.4（miniprogram-automator>jimp 链）
  # - http-cache-semantics <4.1.1（@tarojs/cli>download-git-repo>download>got 链；
  #   收敛到 4.3.0，不走 4.1.1 降级）
  # - brace-expansion 2.x/4.x（glob/minimatch 链；1.x 已有既有 override）
  # - joi <17.13.7（@tarojs/cli>@tarojs/service）
  "jpeg-js@<0.4.4": 0.4.4
  "http-cache-semantics@<4.1.1": 4.3.0
  "brace-expansion@>=2.0.0 <2.1.6": 2.1.7
  "brace-expansion@>=4.0.0 <5.0.11": 5.0.12
  "joi@<17.13.8": 17.13.8
  # 2026-10-29：Dependabot moderate/low 收敛（patch/minor 级别，均开发/
  # 构建/测试工具链）：
  # - qs 6.15.3 → 6.16.2（express 传递；GHSA-6pq8-jhm2-2vcw 等 3 条）
  # - postcss-selector-parser 6.1.4 → 6.1.5
  # - fast-uri 3.1.8 → 3.1.9（既有 override 同步）
  # - @fastify/busboy 3.2.1 → 3.2.2
  # - brace-expansion 1.1.20 → 1.1.21（既有 override 同步）
  # - serialize-javascript 7.0.3 → 7.1.3
  # - joi 17.13.7 → 17.13.8
  # - vitest 4.1.10 → 4.1.12（@vitest/mocker 同步）
  "postcss-selector-parser@<6.1.5": 6.1.5
  "postcss-selector-parser@>=7.0.0 <7.1.6": 7.1.7
  "qs@<6.16.2": 6.16.2
# pnpm 设置真源。pnpm 11 起不再读 package.json 的 "pnpm" 字段（本地 11 实证
# 连 onlyBuiltDependencies 都被静默忽略）；pnpm 10（CI）与 11 都读本文件，
# 本地/CI 行为一致。
auditConfig:
  ignoreGhsas:
    # 2026-10-29：decompress 4.x 两条 critical 公告（GHSA-hrh2-vp3x-79xf
    # 符号链接链路径穿越、GHSA-mp2f-45pm-3cg9 解压越界写）。路径
    # @tarojs/cli>download-git-repo>download>decompress，仅 `taro create`
    # 下载模板时使用；本项目构建/CI/运行均不经过该路径，且 4.x 上游无
    # 修复版（@xhmikosr/decompress 为 ESM-only 的 10.x/11.x 分叉，不能
    # 直接替换 CJS 调用方）。保留 Dependabot 侧 dismiss 记录并跟踪上游。
    - GHSA-hrh2-vp3x-79xf
    - GHSA-mp2f-45pm-3cg9
    # 2026-10-29：git-clone 0.1.0 命令注入（GHSA-8jmw-wjr8-2x66，无修复版）：
    # @tarojs/cli>download-git-repo>git-clone，仅 `taro create` 下载模板使用，
    # 构建/CI/运行不经过；上游无新版，Dependabot 侧 dismiss 并跟踪替换。
    - GHSA-8jmw-wjr8-2x66
    # 2026-10-29：html-minifier 4.0.0 的 high（GHSA-pfq8-rq6v-vf5m，
    # <=4.0.0 全版本受影响、上游无修复版）。路径
    # @tarojs/webpack5-runner>html-minifier，仅构建期 HTML 压缩使用，
    # 输入为本项目自身模板、无用户可控内容；豁免并跟踪上游。
    - GHSA-pfq8-rq6v-vf5m
    # 2026-10-17：两条**无修复版**的构建期传递依赖公告（上游尚无补丁，
    # overrides 无处收敛，只能显式豁免并写明可利用面）。
    # - GHSA-86w9-cpqp-85rv（node-forge RSA PKCS#1 v1.5 签名校验接受多余
    #   嵌套 DigestAlgorithm，high）：路径 webpack-dev-server>selfsigned>
    #   node-forge，仅用于开发服务器生成自签名证书，不解析外部证书、不参与
    #   小程序产物与生产请求。
    # - GHSA-vfj7-8cjw-p6xm（braces 深层嵌套模式导致栈耗尽 DoS，high）：
    #   路径 @tarojs/helper>chokidar>braces 与 micromatch>braces，仅用于
    #   构建期文件监听/glob 匹配，模式串由仓库自身写死，不接受用户输入。
    # 上游发布补丁版后改为 overrides 收敛并移除本豁免。
    - GHSA-86w9-cpqp-85rv
    - GHSA-vfj7-8cjw-p6xm
onlyBuiltDependencies:
  - "@parcel/watcher"
  - "@swc/core"
  - "@tarojs/binding"
  - "@tarojs/cli"
  - esbuild
