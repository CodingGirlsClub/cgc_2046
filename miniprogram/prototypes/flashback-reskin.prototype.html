<title>PROTOTYPE · 闪念间逐页换肤</title>
<!--
  PROTOTYPE · 一次性原型，只在 prototype/flashback-light 分支，不进 develop。
  问题：现有页面结构、交互、文案一律不动，只换视觉语言，能否消除割裂感？
  规则：纸是底 · 墨是字 · 青只画山河 · 暗是暗房（时间胶囊、开卡层、首程）
        火 = 可以按的（每屏最多一处）· 金 = 已经被点亮的（回来的人、授权的句子、回响、选中）
  范围：闪念间角色与旅程盘点 §7 清单；场次页雾卡按 #933 只显示「王**」。
  运行：双击打开；?s=<页面 id> 定位；←/→ 切换页面。
  左图：模拟器 mock 构建的现状截图（合成数据）。右图：换肤后。
-->
<style>

  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",serif;
  --sans:-apple-system,"PingFang SC","Helvetica Neue","Noto Sans SC",sans-serif;
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .32 0 0 0 0 .27 0 0 0 0 .18 0 0 0 .06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
*{box-sizing:border-box;margin:0;padding:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
body{background:#d8d3c7;font-family:var(--sans);color:#262626;height:100vh;overflow:hidden;display:grid;grid-template-columns:232px 1fr 300px}

/* ── 左栏：页面清单 ─────────────────────── */

.side button.on{background:#1e3a2f;color:#fff}
.side button small{color:#999;margin-left:4px}
.side button.on small{color:#b9c6bd}

/* ── 中间：并排对照 ─────────────────────── */

.meter b{display:block;font:600 20px var(--sans)}.meter .f b{color:var(--fire)}.meter .g b{color:var(--gold-ink)}

.capsule{position:absolute;right:10px;top:6px;width:87px;height:32px;border-radius:16px;border:1px solid rgba(0,0,0,.12);background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:space-evenly}

.serif{font-family:var(--serif)}

</style>

/* ════ 渲染与计数 ════ */
let cur=Math.max(0,S.findIndex(s=>s.id===new URLSearchParams(location.search).get('s')));
function side(){
  let html=$('#side').innerHTML.split('<h6')[0], g='';
  S.forEach((s,i)=>{ if(s.group!==g){g=s.group; html+=`<h6>${g}</h6>`} html+=`<button data-i="${i}" class="${i===cur?'on':''}">${s.title}${s.cur?'':'<small>无现状图</small>'}</button>`; });
  $('#side').innerHTML=html;
}
function measure(){
  const root=$('#pR .layer')||$('#pR .vp'); if(!root) return;
  const v=$('#pR').getBoundingClientRect(), tab=$('#pR .tabbar')&&!$('#pR .layer')?84*scale:0;
  const vis=el=>{const r=el.getBoundingClientRect(); if(!r.width) return false; const h=Math.min(r.bottom,v.bottom-tab)-Math.max(r.top,v.top+91*scale); return h>=r.height/2};
  const f=$$('[data-fire]',root).filter(vis).length, g=$$('[data-gold]',root).filter(vis).length;
  $('#mf').textContent=f; $('#mg').textContent=g;
  $('#mv').textContent=f>1?`✗ 火出现 ${f} 处`:f===1?'✓ 火只有一处':'· 这一屏没有主动作';
}
let scale=1;
function fit(){ scale=Math.min(1,(innerHeight-60)/866); $$('.frame').forEach(f=>{f.style.transform=`scale(${scale})`;f.style.height=(866*scale)+'px';f.style.width=(412*scale)+'px'}); }
function render(){
  const s=S[cur];
  $('#pL').innerHTML=s.cur?`<img class="shot" src="current/${s.cur}" alt="现状截图">`:'<div class="none"><b>现状截图缺</b><span>见右侧说明</span></div>';
  $('#pR').className='phone t-'+s.tone;
  $('#pR').innerHTML=chrome(s)+`<div class="vp">${s.page}${s.layer?`<div class="layer" style="position:absolute;inset:0;z-index:35">${s.layer}</div>`:''}</div>`+(s.tab&&!s.layer?tabbar(s.tab,s.ws):s.tab?tabbar(s.tab,s.ws):'')+'<div class="home-bar"></div>';
  $('#notes').innerHTML=`<h2>${s.group} · ${s.title}</h2><div class="who">${s.who}</div>
    <div class="meter"><div class="f"><b id="mf">0</b>火 · 可以按的</div><div class="g"><b id="mg">0</b>金 · 已被点亮的</div></div><div class="verdict" id="mv"></div>
    <h5>换肤改了什么</h5><ul>${s.changed.map(x=>`<li>${x}</li>`).join('')}</ul>
    <h5>没改什么</h5><ul>${s.kept.map(x=>`<li>${x}</li>`).join('')}</ul>
    ${s.flag?`<h5>注意</h5><ul><li>${s.flag}</li></ul>`:''}
    <div class="keys">← / → 切换页面 · 第 ${cur+1} / ${S.length} 页 · 计数只看最上层（有弹层时只数弹层）</div>`;
  history.replaceState(null,'','?s='+s.id); side(); setTimeout(measure,60);
}
document.addEventListener('click',e=>{const b=e.target.closest('.side button'); if(b){cur=+b.dataset.i; render();}});
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key==='ArrowDown'){cur=(cur+1)%S.length;render();e.preventDefault()} if(e.key==='ArrowLeft'||e.key==='ArrowUp'){cur=(cur-1+S.length)%S.length;render();e.preventDefault()} });
addEventListener('resize',()=>{fit();measure()});
fit(); render();
</script>
