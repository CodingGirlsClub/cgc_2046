# Kamal: web service（Next.js standalone 容器）
# 与 backend.yml 分开部署（各自独立 blue-green）：
#   KAMAL_REGISTRY_PASSWORD=<TCR token> kamal deploy -c config/deploy.yml
# 注意与 backend 的差异：service 名不同（容器/proxy 角色隔离），
# 不带 accessories（PG 只随 backend）。

service: cgc2046-web
image: codingirlsclub/cgc2046-web

ssh:
  user: deploy

servers:
  web:
    - <SERVER_HOST>

proxy:
  # hosts 列表：裸域 + www 都由本服务响应（ACME 会给两个域名分别签证书）。
  # SEO 去重靠页面 canonical（NEXT_PUBLIC_WEB_BASE_URL 指裸域，#254）。
  # kamal-proxy 原生 --canonical-host 未被 Kamal 2.12 配置层暴露，
  # 上游支持后再切真正的 301 收敛。
  hosts:
    - codingirlsclub.com
    - www.codingirlsclub.com
  ssl: true
  app_port: 3000
  healthcheck:
    path: /

registry:
  server: <TCR_REGISTRY>
  # 同 backend：username 经 CI sed 替换，不硬编码
  username: <TCR_USERNAME>
  password:
    - KAMAL_REGISTRY_PASSWORD

# NEXT_PUBLIC_* 构建时内联（#254）：经 builder args 传入 docker build，
# 运行时注入对静态产物无效
builder:
  # web 的 Dockerfile COPY 全部相对 web/ 自身（无 backend/ 前缀），
  # context 即当前目录；dockerfile 相对 CWD（CI working-directory=web）
  context: "."
  dockerfile: "Dockerfile"
  arch: amd64
  args:
    # CI sed 替换占位符（TCR_REGISTRY 模式）——Kamal 对 builder args 的
    # ${VAR} 零插值（2026-08-21 实证：runner shell 展开为空串骗过 next.config
    # 的 ?? throw，生产 rewrites 自引用 404）。值来自 GitHub vars。
    NEXT_PUBLIC_WEB_BASE_URL: <NEXT_PUBLIC_WEB_BASE_URL>
    BACKEND_URL: <BACKEND_URL>
