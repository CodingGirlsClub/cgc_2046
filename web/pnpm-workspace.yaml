# overrides 不在这里，唯一真源是 package.json 的 "pnpm.overrides"。
# 实证（2026-11-16）：pnpm 10.28.2（CI 与本地钉的版本，见 package.json 的
# packageManager）完全忽略本文件的 overrides 键——锁文件 overrides 段只记录
# package.json 的条目；pnpm 11 则相反，只读本文件、忽略 package.json。
# miniprogram/ 因此静默失效并退回 22 条 Dependabot 告警（#1288 修复），
# 本文件同款问题在 web 侧一并收口。
# 升级 pnpm 11 前必须一并做：package.json overrides 迁回本文件 → 用 11 重算
# 锁文件 → ci.yml 两处 pnpm 版本升到 11，否则会再次静默退回。
# 各条 override 的公告/传递链理由见 git 历史（本文件 2026-11-16 之前的版本）。
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
