# CGC-2046 连接器扩展 manifest
# id 必须与目录名一致（openclacky ext pack 强制校验）
id: cgc-2046
name: CGC-2046
version: "0.2.0"
origin: self
# 与 repo 根 LICENSE 一致（GNU Affero General Public License v3）
license: AGPL-3.0-only
description: CGC-2046 平台连接器：写入 MCP 配置、提供工作台助手与连接引导

# 生产默认值（面向分发，用户零配置即可连生产）；本地联调用 connect API 的
# url 入参覆盖 mcp_url（如 http://localhost:4000/mcp），web_url 改本地副本。
# 全包唯一改 URL 的点
config:
  mcp_url: "https://api.codingirlsclub.com/mcp"
  web_url: "https://codingirlsclub.com"

contributes:
  api: api/handler.rb
  panels:
    # S1-S4 重构:单一入口 hub 面板(替代原 workspace 连接面板,挂侧栏顶部;
    # 发现/课程保留为隐藏功能页,经目录卡 openWorkspace 直达)
    - id: cgc
      title: CGC 2046
      title_zh: 程序媛汇 2046
      description: CGC-2046 hub (connection, identity, role-aware catalog, assistant session)
      description_zh: 程序媛汇 2046 工作台（连接、身份、角色目录、助手会话入口）
      view: panels/cgc-home/view.js
      order: 5
    # U9(plan 001/#180 R15):课程学习面板(纯视图,数据走 loopback MCP 透传)
    - id: cgc-2046-course
      title: CGC Course
      title_zh: CGC 课程学习
      description: CGC-2046 course learning (issues view and session launch)
      description_zh: CGC-2046 课程学习(学习单元视图与会话唤起)
      view: panels/cgc-course/view.js
      order: 9
    # S2 教研拆出:草稿编辑器 + prep 状态区独立面板(canEdit 角色入口;
    # 学习中心不再承载教研)
    - id: cgc-2046-curriculum
      title: CGC Curriculum
      title_zh: CGC 教研工作台
      description: Curriculum workspace for tutors (draft editor + prep pipeline)
      description_zh: 教研工作台(课程草稿编辑与教研流程;对齐后端 Curriculum 教研域)
      view: panels/cgc-2046-curriculum/view.js
      order: 12
    # U6:发现面板(公开活动/课程,数据走 loopback MCP 透传,公开工具无需 workspace_id)
    - id: cgc-2046-discovery
      title: CGC Discovery
      title_zh: CGC 发现
      description: CGC-2046 public offerings discovery (events & courses, web detail links)
      description_zh: CGC-2046 公开活动与课程发现(条目跳 web 详情页)
      view: panels/cgc-discovery/view.js
      order: 10
    # 会话伴学侧栏(session.aside,attach cgc-assistant;点目标直接注入会话指令,
    # 替代课程页「复制学习指令」的剪贴板管道)
    - id: cgc-2046-learn
      title: CGC Learn
      title_zh: 学这一节
      description: Session-aside learning companion (objectives, review queue, inject-and-go)
      description_zh: 会话侧学习伴读(目标地图/待复习/一键注入会话)
      view: panels/cgc-learn/view.js
      order: 15
      attach: [cgc-assistant]
  agents:
    - id: cgc-assistant
      prompt: agents/cgc-assistant/system_prompt.md
      title: "CGC-2046 助手"
      skills: [cgc2046-onboarding]
      # 会话伴学侧栏对 CGC 助手会话可见(宿主 panel_agents_map 按 agent.panels
      # 引用驱动 session 面板可见性,qingclaw 同款)
      panels: [cgc-2046-learn]
  skills:
    - id: cgc2046-onboarding
  hooks:
    - event: on_tool_error
      file: hooks/on_tool_error.rb
    - event: after_tool_use
      file: hooks/after_tool_use.rb
