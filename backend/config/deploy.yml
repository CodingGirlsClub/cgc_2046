# Kamal: backend service（Elixir release 容器）
# 运行方式（CI 或本地）：
#   KAMAL_REGISTRY_PASSWORD=<TCR token> kamal deploy -c config/backend.yml
# 镜像推腾讯云 TCR 个人版（同地域内网拉取）；env 从 GitHub production
# environment 注入进程环境，secret 类绝不写死在此文件。

service: cgc2046-backend
image: codingirlsclub/cgc2046-backend

servers:
  # web role 专属 proxy 块（#278）：forward_headers 必须写在这里而非顶层——
  # 顶层键会经 deep_merge 流入 ops role（role 未显式设置的键继承顶层，
  # strip/ssl 已各踩一次）。api 域流量多为直连（Bearer/webhook），XFF 由
  # proxy append 真实 peer，RemoteIp 从右解析取第一个非信任 IP 即真实值。
  web:
    hosts:
      - <SERVER_HOST>
    proxy:
      # ssl:true 时 kamal-proxy 默认丢弃传入 XFF（gem docs proxy.yml:79-80）
      # ——Next rewrite 第二跳带来的真实 client 会被静默重置，限流修复被抵消
      forward_headers: true
  # ops：同一镜像第二个容器，服务主域 /ops/*（浏览器会话唯一归属主域的
  # 架构规则——AshAdmin 等 LiveView 面必须经主域到达，cookie 才随行）。
  # 非 primary role 需显式 proxy map；不 strip prefix（Phoenix 路由本身带 /ops）
  ops:
    hosts:
      - <SERVER_HOST>
    proxy:
      host: codingirlsclub.com
      # 显式 false 覆盖顶层 ssl: true（role merge 只覆盖出现的键，删除
      # 键=继承）。kamal-proxy 要求 TLS 只配在根 path 服务（主域根服务
      # = cgc2046-web，证书由它终结）；子路径服务带 --tls 会被拒：
      # "TLS settings must be specified on the root path service"
      ssl: false
      # #278：ssl:false 时 kamal-proxy 默认反转为转发传入 XFF（gem docs
      # proxy.yml:79-80）——ops 一跳直达浏览器，须显式关掉以保持重置语义
      # （伪造 XFF 在入口即被丢弃，不进 Phoenix；web role 反之见上）
      forward_headers: false
      path_prefix: /ops
      strip_path_prefix: false
      app_port: 4000
      healthcheck:
        path: /healthz
        interval: 5
        timeout: 5

# 部署用户：deploy（sudo 免密 + docker 组；见 ~/.ssh/config cgc_production_server）
ssh:
  user: deploy

proxy:
  host: api.codingirlsclub.com
  # Kamal 2.12 ssl 默认 false——必须显式开启（ACME 自动签发）
  ssl: true
  # kamal-proxy 占 80/443，ACME 自动签发续期
  app_port: 4000
  healthcheck:
    path: /healthz
    interval: 5
    timeout: 5

registry:
  server: <TCR_REGISTRY>
  # username 经 CI sed 替换（GitHub vars TCR_USERNAME）；纯数字账号名
  # 不硬编码进开源仓库
  username: <TCR_USERNAME>
  # 数组形式才走 secrets lookup（字符串会被远程 shell 展开为空——
  # "password is empty" 的根因）；值从 .kamal/secrets 解析
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  clear:
    PHX_HOST: api.codingirlsclub.com
    PORT: "4000"
    POOL_SIZE: "10"
  secret:
    - DATABASE_URL
    - SECRET_KEY_BASE
    - TOKEN_SIGNING_SECRET
    - SENDCLOUD_API_USER
    - SENDCLOUD_API_KEY
    - SENDCLOUD_FROM
    - SENDCLOUD_FROM_NAME
    - SENDCLOUD_SMS_USER
    - SENDCLOUD_SMS_KEY
    - SENDCLOUD_SMS_TEMPLATE_ID
    - WEB_BASE_URL
    - CORS_ORIGIN
    # 支付渠道（可选门禁：缺凭证时 provider_not_configured，boot 不崩）
    - WECHAT_PAY_MCH_ID
    - WECHAT_PAY_APPID
    - WECHAT_PAY_API_V3_KEY
    - WECHAT_PAY_API_V2_KEY
    - WECHAT_PAY_CLIENT_SERIAL_NO
    - WECHAT_PAY_CLIENT_PRIVATE_KEY
    - WECHAT_PAY_PUBLIC_KEY
    - WECHAT_PAY_PUBLIC_KEY_ID
    - PAYMENTS_WEBHOOK_BASE_URL
    - ALIPAY_APP_ID
    - ALIPAY_PRIVATE_KEY
    - ALIPAY_PUBLIC_KEY
    - ALIPAY_SANDBOX
    # 微信扫码登录（可选门禁：缺省 wechat_login_unavailable）
    - WECHAT_WEB_APPID
    - WECHAT_WEB_SECRET
    # 微信小程序凭证（可选门禁：缺值 platform_not_configured，boot 不崩；
    # runtime.exs 注释见 issue #264——web 先行部署、小程序上架时补齐）
    - WECHAT_MP_APPID
    - WECHAT_MP_SECRET
    # 订阅消息模板 ID（2026-08-26 平台申请：参与活动提醒/待处理申请提醒/活动开始提醒；
    # 其余模板槽未配置时发送侧静默跳过，不阻塞）
    - WECHAT_MP_TEMPLATE_APPROVAL_RESULT
    - WECHAT_MP_TEMPLATE_APPROVAL_REMINDER
    - WECHAT_MP_TEMPLATE_EVENT_REMINDER

# 数据库迁移在切流前完成（blue-green 新容器执行，旧容器不受影响）
accessories:
  # Postgres 自托管容器（缺钱方案：与 app 同机，不归 Kamal 部署周期管）
  postgres:
    image: postgres:16
    host: <SERVER_HOST>
    env:
      clear:
        POSTGRES_DB: cgc_2046_prod
        POSTGRES_USER: cgc_2046
      secret:
        - POSTGRES_PASSWORD
    volumes:
      - /opt/cgc/postgres/data:/var/lib/postgresql/data

# SSH 私钥/registry 密码经 KAMAL_REGISTRY_PASSWORD 与 ssh key 配置注入，
# 不落仓库。builder：x86 服务器在 CI x86 runner 上直接构建，无需 remote builder。
builder:
  # CI working-directory=backend（CWD）；docker --file 相对 CWD 而非
  # context；context=".."=repo根（Dockerfile COPY backend/… 需根上下文）
  context: ".."
  dockerfile: "Dockerfile"
  arch: amd64
  args:
    # deps 预编译基础镜像（Dockerfile.deps，tag=mix.lock 哈希）。CI sed 替换
    # 占位符（TCR_REGISTRY 模式）——Kamal 对 builder args 的 ${VAR} 零插值
    # （2026-08-21 本地实证），ERB 也读不到 .kamal/secrets。
    # 取代 buildx cache：mode=max 导出 GB 级中间层到 GHA cache 已实证挂起
    # （run 32375926425）。基础镜像把导出频率降为「每次 mix.lock 变更」一次。
    # 数据勘误：无 cache 全量 deploy 实测 ~10min（非早前注释的 ~20min）
    BACKEND_DEPS_IMAGE: <BACKEND_DEPS_IMAGE>
