type AbilityGrant {
  "能力名：view_workspace \/ access_invite_only \/ list_members \/ manage_members \/ assign_roles \/ create_workspace"
  name: String!

  allowed: Boolean!
}

type PermissionMatrixRow {
  "角色名：owner \/ admin \/ member \/ tutor \/ volunteer \/ learner"
  name: String!

  abilities: [AbilityGrant!]!
}

type PermissionMatrixPayload {
  roles: [PermissionMatrixRow!]!
}

type OfferingReadinessPayload {
  ready: Boolean!
  items: [OfferingReadinessItem!]!
}

type OfferingReadinessItem {
  key: String!
  label: String!
  ok: Boolean!
}

type PendingApproval {
  id: ID!
  kind: String!
  workspaceId: ID!
  userId: ID!
  eventId: ID
  courseId: ID
  status: String!
  approvalDeadline: DateTime
  expiredAt: DateTime
  requesterName: String
  workspaceName: String
  contextTitle: String
}

type MiniprogramCodeResult {
  invitationId: ID!
  platform: String!
  scene: String!
  codeBase64: String!
  expiresAt: DateTime!
}

type SignInResult {
  id: ID!
  email: String!
  isPlatformAdmin: Boolean!
}

type SignInWithPlatformResult {
  id: ID!
  email: String
  isPlatformAdmin: Boolean!
}

type SignUpPayload {
  result: SignUpUser
  errors: [MutationError]
}

type SignUpUser {
  id: ID!
  email: String!
  isPlatformAdmin: Boolean!
}

input SignUpInput {
  email: String!
  password: String!
}

type WorkspaceProfile {
  "per-workspace 成员公开资料（ADR-0004）"
  id: ID!

  workspaceId: ID!

  userId: ID!

  avatarUrl: String

  location: String

  about: String

  skills: [String]

  visibility: String

  uiThemePreference: String!
}

type PortfolioItem {
  "per-workspace 作品集条目（ADR-0004）"
  id: ID!

  workspaceId: ID!

  title: String!

  description: String

  url: String

  icon: String!
}

input UpdateWorkspaceProfileInput {
  "updateWorkspaceProfile 输入（ADR-0004）：avatarUrl\/location\/about\/skills\/visibility 可选"
  avatarUrl: String

  location: String

  about: String

  skills: [String]

  visibility: String
}

input SetWorkspaceThemeInput {
  "setWorkspaceTheme 输入：uiThemePreference 必填，仅 dark | light"
  uiThemePreference: String!
}

input CreatePortfolioItemInput {
  "createPortfolioItem 输入：title 必填，description\/url\/icon 可选"
  title: String!

  description: String

  url: String

  icon: String
}

input UpdatePortfolioItemInput {
  "updatePortfolioItem 输入：title\/description\/url\/icon 可选"
  title: String

  description: String

  url: String

  icon: String
}

type McpToken {
  "MCP 连接 token（明文不可经此类型读回；hash 不落 GraphQL 面）"
  id: ID!

  name: String!

  lastUsedAt: DateTime

  revokedAt: DateTime

  insertedAt: DateTime!
}

type CreateMcpTokenPayload {
  "createMcpToken 返回：result 为 token 记录；plainToken 明文仅此一次"
  result: McpToken

  plainToken: String

  errors: [MutationError]
}

input AcceptInvitationInput {
  "acceptInvitation 输入：token 为明文邀请令牌（accept 须复验）"
  token: String!
}

type AcceptInvitationResult {
  "acceptInvitation 返回：result 为已接受邀请记录；errors 为业务错误"
  result: Invitation

  errors: [MutationError!]!
}

type AdminUser {
  id: ID!
  email: String
  displayName: String
  isPlatformAdmin: Boolean!
  insertedAt: DateTime!
  workspaceMembershipCount: Int
}

type AdminWorkspace {
  id: ID!
  slug: String!
  name: String!
  joinPolicy: String!
  sponsorshipEnabled: Boolean!
  insertedAt: DateTime!
  memberCount: Int!
}

type AdminWorkspaceApplication {
  id: ID!
  applicantId: ID!
  name: String!
  slug: String!
  purpose: String!
  status: String!
  rejectionReason: String
  approvedBy: ID
  approvedAt: DateTime
  rejectedBy: ID
  rejectedAt: DateTime
  insertedAt: DateTime!
}

type AdminToolCallLog {
  id: ID!
  userId: ID!
  tool: String!
  resultStatus: String!
  errorMessage: String
  latencyMs: Int
  insertedAt: DateTime!
}

type AdminPendingOperation {
  id: ID!
  userId: ID!
  tool: String!
  summary: String!
  status: String!
  insertedAt: DateTime!
}

type AdminSignalLog {
  id: ID!
  workspaceId: ID!
  signalType: String!
  insertedAt: DateTime!
}

type AdminActionLog {
  id: ID!
  actorId: ID
  action: String!
  targetType: String!
  targetId: ID!
  result: String!
  insertedAt: DateTime!
}

type AdminUserPayload {
  id: ID
  email: String
  isPlatformAdmin: Boolean
  errors: [MutationError]
}

type RootMutationType {
  "使用邮箱密码登录（#60 路径 B：httpOnly cookie 交付 token）"
  signIn(email: String!, password: String!): SignInResult

  "注册新用户（#60 路径 B：httpOnly cookie 交付 token，自动登录）"
  signUp(input: SignUpInput!): SignUpPayload

  "小程序平台一键登录（N1，Phase 1）：code2session + 平台手机号锚定统一身份，token 经 httpOnly cookie 交付"
  signInWithPlatform(platform: String!, code: String!, encryptedData: String!, iv: String!): SignInWithPlatformResult

  "Owner\/Admin 创建一次性工作台邀请小程序码"
  generateMiniProgramCode(workspaceId: ID!, platform: String!): MiniprogramCodeResult

  "使用一次性小程序 scene 接受工作台邀请"
  admitMemberByToken(scene: String!): Invitation

  "接受邀请→建 Membership + 预授权角色入座（#96：手写 resolver 绕过 read policy 记录加载）"
  acceptInvitation(id: ID!, input: AcceptInvitationInput!): AcceptInvitationResult

  "记录一次小程序订阅消息授权并增加一个可用次数"
  grantMiniProgramNotificationConsent(platform: String!, templateKey: String!): Int

  "登出：服务端撤销当前 token 并清除 httpOnly cookie（token 被偷也无法重放）"
  signOut: String

  "更新当前用户全局显示名（ADR-0004：displayName 保留全局身份字段）"
  updateDisplayName(displayName: String!): User

  "更新当前用户在某工作台的资料（ADR-0004 per-workspace）"
  updateWorkspaceProfile(workspaceId: ID!, input: UpdateWorkspaceProfileInput!): WorkspaceProfile

  "设置当前用户在某工作台的 UI 主题偏好（ADR-0004 per-workspace）"
  setWorkspaceTheme(workspaceId: ID!, input: SetWorkspaceThemeInput!): WorkspaceProfile

  "在某工作台创建作品集条目（ADR-0004；workspace_id 与 user_id 自动填充，防跨租户伪造）"
  createPortfolioItem(workspaceId: ID!, input: CreatePortfolioItemInput!): PortfolioItem

  "更新某工作台自己的作品集条目（ADR-0004；tenant 隔离）"
  updatePortfolioItem(id: ID!, workspaceId: ID!, input: UpdatePortfolioItemInput!): PortfolioItem

  "删除某工作台自己的作品集条目（ADR-0004；tenant 隔离）"
  deletePortfolioItem(id: ID!, workspaceId: ID!): PortfolioItem

  "签发 MCP 连接 token（切片 D #44；明文仅本次经 plainToken 返回一次，库中只存 SHA256 hash）"
  createMcpToken(name: String!): CreateMcpTokenPayload

  "撤销 MCP 连接 token（切片 D #44；仅本人，置 revokedAt 保留审计行；他人 token 一律 not_found 不泄露存在性）"
  revokeMcpToken(id: ID!): McpToken

  "平台管理员：提升用户为 platform_admin（R9；仅 platform_admin 可调）"
  promoteUser(id: ID!): AdminUserPayload

  "平台管理员：降级用户 platform_admin（R9；≥1 admin 不变量由 User :demote_platform_admin action 守卫）"
  demoteUser(id: ID!): AdminUserPayload

  "创建工作台（仅平台管理员）"
  createWorkspace(input: CreateWorkspaceInput!): CreateWorkspaceResult!

  "更新工作台（Owner\/Admin 或平台管理员）"
  updateWorkspace(id: ID!, input: UpdateWorkspaceInput): UpdateWorkspaceResult!

  "重指派 Owner（仅平台管理员，pending-owner 期间）：撤销 active Owner 邀请 + 改指现有用户或发新邀请"
  reassignWorkspaceOwner(id: ID!, input: ReassignWorkspaceOwnerInput): ReassignWorkspaceOwnerResult!

  "直接加入公开工作台（join_policy==:open）→ 建 Membership + learner 角色"
  joinWorkspace(input: JoinWorkspaceInput!): Workspace!

  "分配成员角色（多角色并集，仅 Owner\/Admin）"
  assignRoles(id: ID!, input: AssignRolesInput!): AssignRolesResult!

  "提交加入申请"
  createJoinRequest(input: CreateJoinRequestInput!): CreateJoinRequestResult!

  "审批通过加入申请（Owner\/Admin，自动建 Membership + MembershipRole）"
  approveJoinRequest(id: ID!, input: ApproveJoinRequestInput): ApproveJoinRequestResult!

  "拒绝加入申请（Owner\/Admin）"
  rejectJoinRequest(id: ID!, input: RejectJoinRequestInput): RejectJoinRequestResult!

  "创建邀请（Owner\/Admin\/Volunteer）"
  createInvitation(input: CreateInvitationInput!): CreateInvitationResult!

  "撤销邀请（邀请人本人或 Owner\/Admin 或平台管理员）"
  revokeInvitation(id: ID!): RevokeInvitationResult!

  "提交创建工作台申请"
  createWorkspaceApplication(input: CreateWorkspaceApplicationInput!): CreateWorkspaceApplicationResult!

  "审批通过创建工作台申请（platform_admin，自动创建 workspace + applicant 为 Owner）"
  approveWorkspaceApplication(id: ID!): ApproveWorkspaceApplicationResult!

  "拒绝创建工作台申请（platform_admin）"
  rejectWorkspaceApplication(id: ID!, input: RejectWorkspaceApplicationInput): RejectWorkspaceApplicationResult!

  "创建活动（默认 status=draft）"
  createEvent(input: CreateEventInput!): CreateEventResult!

  "编辑活动元数据（Owner\/Admin）"
  updateEvent(id: ID!, input: UpdateEventInput): UpdateEventResult!

  "发布活动：draft → open，发 event.launched 信号"
  launchEvent(id: ID!): LaunchEventResult!

  "结束活动：open → closed，发 event.ended 信号"
  closeEvent(id: ID!): CloseEventResult!

  "取消活动：open → cancelled，发 event.ended 信号"
  cancelEvent(id: ID!): CancelEventResult!

  "创建课程（默认 status=draft）"
  createCourse(input: CreateCourseInput!): CreateCourseResult!

  "编辑课程元数据（Owner\/Admin）"
  updateCourse(id: ID!, input: UpdateCourseInput): UpdateCourseResult!

  "发布课程：draft → open，发 course.launched 信号"
  launchCourse(id: ID!): LaunchCourseResult!

  "结束课程：open → closed，发 course.ended 信号"
  closeCourse(id: ID!): CloseCourseResult!

  "取消课程：open → cancelled，发 course.ended 信号"
  cancelCourse(id: ID!): CancelCourseResult!

  createInviteBatch(input: CreateInviteBatchInput!): CreateInviteBatchResult!

  disableInviteBatch(id: ID!): DisableInviteBatchResult!

  "创建报名；open\/invite_only 立即占位，request 等待审批"
  createEnrollment(input: CreateEnrollmentInput!): CreateEnrollmentResult!

  "Owner\/Admin 确认 pending 报名并原子占用名额"
  confirmEnrollment(id: ID!): ConfirmEnrollmentResult!

  "Owner\/Admin 拒绝 pending 报名"
  rejectEnrollment(id: ID!, input: RejectEnrollmentInput): RejectEnrollmentResult!

  "报名人取消报名；confirmed 报名释放名额"
  cancelEnrollment(id: ID!): CancelEnrollmentResult!
}

"""
The `Json` scalar type represents arbitrary json string data, represented as UTF-8
character sequences. The Json type is most often used to represent a free-form
human-readable json string.
"""
scalar JsonString

"""
The `Json` scalar type represents arbitrary json string data, represented as UTF-8
character sequences. The Json type is most often used to represent a free-form
human-readable json string.
"""
scalar Json

"""
The `DateTime` scalar type represents a date and time in the UTC
timezone. The DateTime appears in a JSON response as an ISO8601 formatted
string, including UTC timezone ("Z"). The parsed date and time string will
be converted to UTC if there is an offset.
"""
scalar DateTime
