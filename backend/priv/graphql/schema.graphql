  "当前用户作为 Owner\/Admin 的跨工作台待审批项（Enrollment + JoinRequest）；include_expired=true 时附带已过期行（只读展示，E-8 #123）"
  myPendingApprovals(includeExpired: Boolean): [PendingApproval!]!

  "平台管理员：用户列表（R8；search 匹配 email\/display_name，分页 first\/after）"
  listUsers(search: String, first: Int, after: String): [AdminUser!]!

  "平台管理员：工作台列表（R13；search 匹配 name\/slug，分页 first\/after）"
  listWorkspaces(search: String, first: Int, after: String): [AdminWorkspace!]!

  "平台管理员：工作台创建申请列表（R7；status 过滤，分页 first\/after）"
  listWorkspaceApplications(status: String, first: Int, after: String): [AdminWorkspaceApplication!]!

  "当前用户（申请人）的工作台创建申请列表（R7a；任何人可见自己的申请）"
  myWorkspaceApplications: [AdminWorkspaceApplication!]!

  "平台管理员：MCP 工具调用审计日志（R10；workspaceId 按 params JSONB 过滤，D5）"
  listToolCallLogs(
    workspaceId: ID, status: String, insertedAfter: DateTime, insertedBefore: DateTime, first: Int, after: String
  ): [AdminToolCallLog!]!

  "平台管理员：MCP 待确认操作日志（R10；workspaceId 按 params JSONB 过滤，D5）"
  listPendingOperations(
    workspaceId: ID, status: String, insertedAfter: DateTime, insertedBefore: DateTime, first: Int, after: String
  ): [AdminPendingOperation!]!

  "平台管理员：workflow 信号日志（R10；workspaceId 按真实列过滤，分页 first\/after）"
  listSignalLogs(
    workspaceId: ID, signalType: String, insertedAfter: DateTime, insertedBefore: DateTime, first: Int, after: String
  ): [AdminSignalLog!]!

  "平台管理员：治理操作留痕（#116 R10a；action 过滤，分页 first\/after）"
  listAdminActionLogs(action: String, insertedAfter: DateTime, insertedBefore: DateTime, first: Int, after: String): [AdminActionLog!]!

  "按 slug 获取工作台（需登录）"
  getWorkspace(
    "A filter to limit the results"
    filter: WorkspaceFilterInput

    slug: String!
  ): Workspace

  "按 id 获取工作台（需登录）"
  getWorkspaceById(
    "A filter to limit the results"
    filter: WorkspaceFilterInput

    id: ID!
  ): Workspace

  "当前用户可进入的工作台列表（成员资格 + 创建者）"
  meWorkspaces(
    "How to sort the records in the response"
    sort: [WorkspaceSortInput]

    "A filter to limit the results"
    filter: WorkspaceFilterInput
  ): [Workspace!]!

  "工作台成员列表（成员本人仅见自己；Owner\/Admin 见全部，供成员管理页）"
  workspaceMembers(
    "How to sort the records in the response"
    sort: [WorkspaceMembershipSortInput]

    "A filter to limit the results"
    filter: WorkspaceMembershipFilterInput

    "The number of records to return from the beginning. Maximum 250"
    first: Int

    "Show records before the specified keyset."
    before: String

    "Show records after the specified keyset."
    after: String

    "The number of records to return to the end. Maximum 250"
    last: Int
  ): KeysetPageOfWorkspaceMembership

  "加入申请列表（申请人仅见自己；Owner\/Admin 见全部）"
