type User {
  id: ID!

  "用户邮箱（全局唯一，登录身份标识）"
  email: String!

  "是否平台管理员（全局标记）"
  isPlatformAdmin: Boolean!

  "显示名（#68 Profile API；可为 null，前端以 email 前缀兜底）"
  displayName: String

  "头像 URL（#68 Profile API，可选；data URL 限 image\/png|jpeg|webp|gif 且 ≤2.2MB，http(s) URL 限 2048 字符）"
  avatarUrl: String

  "所在地（P1 Profile 扩展字段，可编辑）"
  location: String

  "个人简介（P1 Profile 扩展字段，可编辑）"
  about: String

  "技能标签列表（P1 Profile 扩展字段，可编辑）"
  skills: [String!]

  "资料可见范围（三档）：public 所有登录用户可读 \/ workspace 同工作区成员可读 \/ only_me 仅本人可读（默认，隐私优先）"
  visibility: String!

  "用户 UI 主题偏好（U3）：dark（默认）\/ light，服务端持久化用于跨设备同步"
  uiThemePreference: String!

  "平台级成员编号（P1 由用户 id 确定性生成，格式 CGC-XXXXXX，稳定唯一）"
  memberNumber: String

  "注册（加入）时间"
  joinedAt: DateTime
}

type RootQueryType {
  "Placeholder query until the first resource is added"
  ping: String

  "角色权限矩阵（#66 Rbac）：六角色 × 六能力，对齐前端权限表（需登录；#1 能力接口：abilities 为通用列表）"
  permissionMatrix: PermissionMatrixPayload

  "当前登录用户个人资料（#68 Profile API，需登录）：id\/email\/displayName\/avatarUrl\/isPlatformAdmin + P1 扩展字段"
  me: User

  "按 slug 获取工作台（需登录）"
  getWorkspace(
    "A filter to limit the results"
    filter: WorkspaceFilterInput

    slug: String!
  ): Workspace

  "按 id 获取工作台（需登录）"
  getWorkspaceById(
    "A filter to limit the results"
    filter: WorkspaceFilterInput

    id: ID!
  ): Workspace

  "当前用户可进入的工作台列表（成员资格 + 创建者）"
  meWorkspaces(
    "How to sort the records in the response"
    sort: [WorkspaceSortInput]

    "A filter to limit the results"
    filter: WorkspaceFilterInput
  ): [Workspace!]!

  "工作台成员列表（成员本人仅见自己；Owner\/Admin 见全部，供成员管理页）"
  workspaceMembers(
    "How to sort the records in the response"
    sort: [WorkspaceMembershipSortInput]

    "A filter to limit the results"
    filter: WorkspaceMembershipFilterInput

    "The number of records to return from the beginning. Maximum 250"
    first: Int

    "Show records before the specified keyset."
    before: String

    "Show records after the specified keyset."
    after: String

    "The number of records to return to the end. Maximum 250"
    last: Int
  ): KeysetPageOfWorkspaceMembership

  "当前用户的作品集条目列表"
  myPortfolio(
    "How to sort the records in the response"
    sort: [PortfolioItemSortInput]

    "A filter to limit the results"
    filter: PortfolioItemFilterInput
  ): [PortfolioItem!]!
}

type SignInResult {
  id: ID!
  email: String!
  isPlatformAdmin: Boolean!
}

type SignUpPayload {
  result: SignUpUser
  errors: [AuthMutationError]
}

type SignUpUser {
  id: ID!
  email: String!
  isPlatformAdmin: Boolean!
}

type AuthMutationError {
  message: String
  code: String
}

input SignUpInput {
  email: String!
  password: String!
}

input UpdateProfileInput {
  "updateProfile 输入（P1）：displayName 必填，avatarUrl\/location\/about\/skills\/visibility 可选"
  displayName: String!

  avatarUrl: String

  location: String

  about: String

  skills: [String]

  visibility: String
}

input SetUiThemeInput {
  "setUiTheme 输入（U3）：uiThemePreference 必填，仅 dark | light"
  uiThemePreference: String!
}

type RootMutationType {
  "使用邮箱密码登录（#60 路径 B：httpOnly cookie 交付 token）"
  signIn(email: String!, password: String!): SignInResult

  "注册新用户（#60 路径 B：httpOnly cookie 交付 token，自动登录）"
  signUp(input: SignUpInput!): SignUpPayload

  "登出：清除 httpOnly cookie 中的认证 token"
  signOut: String

  "更新当前用户个人资料（#68）：displayName 必填（trim 后非空），avatarUrl 可选"
  updateProfile(input: UpdateProfileInput!): User

  "设置当前用户 UI 主题偏好（U3）：dark | light，服务端持久化"
  setUiTheme(input: SetUiThemeInput!): User

  "创建工作台（仅平台管理员）"
  createWorkspace(input: CreateWorkspaceInput!): CreateWorkspaceResult!

  "更新工作台（Owner\/Admin 或平台管理员）"
  updateWorkspace(id: ID!, input: UpdateWorkspaceInput): UpdateWorkspaceResult!

  "分配成员角色（多角色并集，仅 Owner\/Admin）"
  assignRoles(id: ID!, input: AssignRolesInput!): AssignRolesResult!

  "创建作品集条目（user_id 自动为当前用户）"
  createPortfolioItem(input: CreatePortfolioItemInput!): CreatePortfolioItemResult!

  "更新自己的作品集条目"
  updatePortfolioItem(id: ID!, input: UpdatePortfolioItemInput): UpdatePortfolioItemResult!

  "删除自己的作品集条目"
  deletePortfolioItem(id: ID!): DeletePortfolioItemResult!
}

"""
The `Json` scalar type represents arbitrary json string data, represented as UTF-8
character sequences. The Json type is most often used to represent a free-form
human-readable json string.
"""
scalar Json

"""
The `DateTime` scalar type represents a date and time in the UTC
timezone. The DateTime appears in a JSON response as an ISO8601 formatted
string, including UTC timezone ("Z"). The parsed date and time string will
be converted to UTC if there is an offset.
"""
scalar DateTime

type AbilityGrant {
  "能力名：view_workspace \/ access_invite_only \/ list_members \/ manage_members \/ assign_roles \/ create_workspace"
  name: String!

  allowed: Boolean!
}

type PermissionMatrixRow {
  "角色名：owner \/ admin \/ member \/ tutor \/ volunteer \/ learner"
  name: String!

  abilities: [AbilityGrant!]!
}

type PermissionMatrixPayload {
  roles: [PermissionMatrixRow!]!
}
