  createWorkspace(input: CreateWorkspaceInput!): CreateWorkspaceResult!

  "更新工作台（Owner\/Admin 或平台管理员）"
  updateWorkspace(id: ID!, input: UpdateWorkspaceInput): UpdateWorkspaceResult!

  "直接加入公开工作台（join_policy==:open）→ 建 Membership + learner 角色"
  joinWorkspace(input: JoinWorkspaceInput!): Workspace!

  "分配成员角色（多角色并集，仅 Owner\/Admin）"
  assignRoles(id: ID!, input: AssignRolesInput!): AssignRolesResult!

  "提交加入申请"
  createJoinRequest(input: CreateJoinRequestInput!): CreateJoinRequestResult!

  "审批通过加入申请（Owner\/Admin，自动建 Membership + MembershipRole）"
  approveJoinRequest(id: ID!, input: ApproveJoinRequestInput): ApproveJoinRequestResult!

  "拒绝加入申请（Owner\/Admin）"
  rejectJoinRequest(id: ID!, input: RejectJoinRequestInput): RejectJoinRequestResult!

  "创建邀请（Owner\/Admin\/Volunteer）"
  createInvitation(input: CreateInvitationInput!): CreateInvitationResult!

  "撤销邀请（邀请人本人或 Owner\/Admin）"
  revokeInvitation(id: ID!): RevokeInvitationResult!

  "接受邀请→建 Membership + 预授权角色入座"
  acceptInvitation(id: ID!, input: AcceptInvitationInput!): AcceptInvitationResult!
}

