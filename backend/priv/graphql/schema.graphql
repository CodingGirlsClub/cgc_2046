  getWorkflowRun(
    "A filter to limit the results"
    filter: WorkflowRunFilterInput

    id: ID!
  ): WorkflowRun

  "工作台的活动列表（#40 展示页）"
  listEvents(
    "How to sort the records in the response"
    sort: [EventSortInput]

    "A filter to limit the results"
    filter: EventFilterInput

    "The number of records to return from the beginning. Maximum 250"
    first: Int

    "Show records before the specified keyset."
    before: String

    "Show records after the specified keyset."
    after: String

    "The number of records to return to the end. Maximum 250"
    last: Int
  ): KeysetPageOfEvent

  "按 id 获取活动（#40）"
  getEvent(
    "A filter to limit the results"
    filter: EventFilterInput

    id: ID!
  ): Event

  "按 slug 获取（E-5 公开宿主页）"
  getEventBySlug(
    "A filter to limit the results"
    filter: EventFilterInput

    slug: String!
  ): Event

  "工作台的课程列表（#40 展示页）"
  listCourses(
    "How to sort the records in the response"
    sort: [CourseSortInput]

    "A filter to limit the results"
    filter: CourseFilterInput

    "The number of records to return from the beginning. Maximum 250"
    first: Int

    "Show records before the specified keyset."
