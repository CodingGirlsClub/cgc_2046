type RootMutationType {
  "账号密码登录（plan 002 U2：login 含 @ 走邮箱，否则手机号归一化；token 经 httpOnly cookie 交付）"
  signIn(login: String!, password: String!): SignInResult

  "请求发送手机验证码（plan 002 U3；限流 phone 1\/60s + 5\/1h + 20\/1d、IP 30\/1d）"
  requestPhoneCode(phone: String!, purpose: PhoneCodePurpose!): RequestPhoneCodeResult

  "手机验证码登录（plan 002 U3；用户不存在自动建号；token 经 httpOnly cookie 交付）"
  signInWithPhoneCode(phone: String!, code: String!): SignInWithPhoneCodeResult

  "发起微信扫码登录（plan 002 U4；未配置 → wechat_login_unavailable；IP 20\/15min 限流）"
  wechatLoginStart(
    "发起微信扫码登录(plan 002 U4);next 透传进 redirect_uri(callback 页同源校验后跳转)"
    next: String
  ): WechatLoginStartResult

  "微信扫码回调（plan 002 U4；IP 20\/15min 限流）：已绑定直登，未绑定返回绑定票据"
  signInWithWechat(code: String!, state: String!): SignInWithWechatResult

  "微信扫码绑定手机号完成登录（plan 002 U4；phone 5\/15min 限流）"
  bindWechatWithPhone(bindTicket: String!, phone: String!, code: String!): SignInWithPhoneCodeResult

  "手机号注册（验证码 + 密码；httpOnly cookie 交付 token，自动登录）"
  signUpWithPhone(input: SignUpWithPhoneInput!): SignUpWithPhonePayload

  "请求发送密码重置邮件（无论邮箱是否存在都返回统一成功结果）"
  requestPasswordReset(email: String!): RequestPasswordResetResult

  "使用一次性密码重置 token 设置新密码"
  resetPassword(resetToken: String!, password: String!): ResetPasswordResult

  "小程序平台一键登录（N1，Phase 1）：code2session + 平台手机号锚定统一身份，token 经 httpOnly cookie 交付"
  signInWithPlatform(platform: String!, code: String!, phoneCode: String, encryptedData: String, iv: String): SignInWithPlatformResult

  "Owner\/Admin 创建一次性工作台邀请小程序码"
  generateMiniProgramCode(workspaceId: ID!, platform: String!): MiniprogramCodeResult

  "使用一次性小程序 scene 接受工作台邀请"
  admitMemberByToken(scene: String!): Invitation

  "接受邀请→建 Membership + 预授权角色入座（#96：手写 resolver 绕过 read policy 记录加载）"
  acceptInvitation(id: ID!, input: AcceptInvitationInput!): AcceptInvitationResult

  "记录一次小程序订阅消息授权并增加一个可用次数"
  grantMiniProgramNotificationConsent(platform: String!, templateKey: String!): Int

  "登出：服务端撤销当前 token 并清除 httpOnly cookie（token 被偷也无法重放）"
  signOut: String

  "更新当前用户全局显示名（ADR-0004：displayName 保留全局身份字段）"
  updateDisplayName(displayName: String!): User

  "绑定\/换绑当前用户手机号（验证码 purpose=CHANGE_PHONE 验新号；仅本人；目标号已被他人占用即拒绝，不做自助合并）"
  updateMyPhone(phone: String!, code: String!): User

  "更新当前用户界面语言偏好（i18n Phase 1；zh-CN | en，仅本人）"
  updateMyLocale(locale: String!): User

  "拒绝首公里接入邀请（每次登录弹直到明确拒绝；幂等保留首次拒绝时间戳，仅本人）"
  dismissOnboardingInvitation: User

  "更新当前用户在某工作台的资料（ADR-0004 per-workspace）"
  updateWorkspaceProfile(workspaceId: ID!, input: UpdateWorkspaceProfileInput!): WorkspaceProfile

  "设置当前用户在某工作台的 UI 主题偏好（ADR-0004 per-workspace）"
  setWorkspaceTheme(workspaceId: ID!, input: SetWorkspaceThemeInput!): WorkspaceProfile

  "在某工作台创建作品集条目（ADR-0004；workspace_id 与 user_id 自动填充，防跨租户伪造）"
  createPortfolioItem(workspaceId: ID!, input: CreatePortfolioItemInput!): PortfolioItem

  "更新某工作台自己的作品集条目（ADR-0004；tenant 隔离）"
  updatePortfolioItem(id: ID!, workspaceId: ID!, input: UpdatePortfolioItemInput!): PortfolioItem

  "删除某工作台自己的作品集条目（ADR-0004；tenant 隔离）"
  deletePortfolioItem(id: ID!, workspaceId: ID!): PortfolioItem

  "签发 MCP 连接 token（切片 D #44；明文仅本次经 plainToken 返回一次，库中只存 SHA256 hash）"
  createMcpToken(name: String!): CreateMcpTokenPayload

  "撤销 MCP 连接 token（切片 D #44；仅本人，置 revokedAt 保留审计行；他人 token 一律 not_found 不泄露存在性）"
  revokeMcpToken(id: ID!): McpToken

  "管理员单笔退款（R15）：第一段——建 pending 并返回后端生成的确认摘要（不落业务库）；confirmOperation 确认后真正执行"
  refundOrder(id: ID!): PendingOperationConfirmation

  "退款失败重试（R17）：第一段——refund_failed 单建 pending（不落业务库）；confirmOperation 确认后重入退款链"
  retryRefund(id: ID!): PendingOperationConfirmation

  "免缴（R18）：第一段——payment_pending 报名建 pending（不落业务库）；confirmOperation 确认后跳过支付直接确认"
  waivePayment(id: ID!): PendingOperationConfirmation

  "确认并执行 pending 操作（仅本人、pending 且未过期；effect 失败 pending 回滚可重试）"
  confirmOperation(pendingId: ID!): OperationResolution

  "取消 pending 操作（仅本人、pending；取消后不执行，过期自动失效）"
  cancelOperation(pendingId: ID!): OperationResolution

  "Owner\/Admin 创建 Speaker 邀请；明文 token 仅经 plainToken 返回一次（库中只存 SHA256 哈希）"
  createSpeakerInvitation(input: CreateSpeakerInvitationInput!): CreateSpeakerInvitationPayload

  "Owner\/Admin 重发邀请\/重新生成链接：旧链接即刻作废，新明文 token 仅经 plainToken 返回一次；有邮箱的同时异步发出新邮件（尽力而为，不承诺送达）"
  resendSpeakerInvitation(id: ID!): ResendSpeakerInvitationPayload

  "Speaker 用邀请 token 接受邀请（着陆页；token 一次性，接受后失效）"
  acceptSpeakerInvitation(token: String!): SpeakerInvitationActionPayload

  "Speaker 用邀请 token 婉拒邀请（着陆页；token 一次性，婉拒后失效）"
  declineSpeakerInvitation(token: String!): SpeakerInvitationActionPayload

  "Speaker 保存分享材料（落 WorkflowRun.facts[materials]；Speaker 本人自助或 Owner\/Admin 兜底；materials 为 JSON 字符串）"
  saveSpeakerMaterials(invitationId: ID!, materials: JsonString!): SpeakerInvitationActionPayload

  "材料产出后完成邀请（Speaker 本人自助或 Owner\/Admin 兜底；accepted → completed）"
  completeSpeakerInvitation(id: ID!): SpeakerInvitationActionPayload

  "平台管理员：提升用户为 platform_admin（R9；仅 platform_admin 可调）"
  promoteUser(id: ID!): AdminUserPayload

  "平台管理员：降级用户 platform_admin（R9；≥1 admin 不变量由 User :demote_platform_admin action 守卫）"
  demoteUser(id: ID!): AdminUserPayload

  "平台管理员：创建倡导活动草稿"
  createInitiative(input: AdminInitiativeInput!): AdminInitiativePayload

  "平台管理员：更新倡导活动元数据"
  updateInitiative(id: ID!, input: AdminInitiativeInput!): AdminInitiativePayload

  "平台管理员：设置倡导活动状态为进行中"
  openInitiative(id: ID!): AdminInitiativePayload

  "平台管理员：结束倡导活动"
  closeInitiative(id: ID!): AdminInitiativePayload

  "平台管理员：中止倡导活动（级联取消挂载中仍开放的场次，已付报名全额退款）"
  cancelInitiative(id: ID!): AdminInitiativePayload

  "平台管理员：发布活动（draft → open；同工作台 launch action 语义）"
  adminLaunchEvent(id: ID!): AdminEventPayload

  "平台管理员：结束活动（open → closed；发 event.ended 信号）"
