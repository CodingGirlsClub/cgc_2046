schema {
  mutation: RootMutationType
  query: RootQueryType
}

"An error generated by a failed mutation"
type MutationError {
  "The human readable error message"
  message: String

  "A shorter error message, with vars not replaced"
  shortMessage: String

  "Replacements for the short message"
  vars: Json

  "An error code for the given error"
  code: String

  "The field or fields that produced the error"
  fields: [String!]

  "The path to the field that produced the error"
  path: [String!]
}

type SignUpMetadata {
  "A JWT which the user can use to authenticate to the API."
  token: String!
}

"The result of the :sign_up mutation"
type SignUpResult {
  "The successful result of the mutation"
  result: User

  "Any errors generated, if the mutation failed"
  errors: [MutationError!]!

  "Metadata produced by the mutation"
  metadata: SignUpMetadata
}

input SignUpInput {
  "用户邮箱（全局唯一，登录身份标识）"
  email: String!

  "The proposed password for the user, in plain text."
  password: String!
}

input UserFilterIsPlatformAdmin {
  isNil: Boolean
  eq: Boolean
  notEq: Boolean
  in: [Boolean!]
  lessThan: Boolean
  greaterThan: Boolean
  lessThanOrEqual: Boolean
  greaterThanOrEqual: Boolean
  isDistinctFrom: Boolean
  isNotDistinctFrom: Boolean
}

input UserFilterEmail {
  isNil: Boolean
  eq: String
  notEq: String
  in: [String!]
  lessThan: String
  greaterThan: String
  lessThanOrEqual: String
  greaterThanOrEqual: String
  contains: String
  isDistinctFrom: String
  isNotDistinctFrom: String
  stringEndsWith: String
  stringStartsWith: String
}

input UserFilterId {
  isNil: Boolean
  eq: ID
  notEq: ID
  in: [ID!]
  lessThan: ID
  greaterThan: ID
  lessThanOrEqual: ID
  greaterThanOrEqual: ID
  isDistinctFrom: ID
  isNotDistinctFrom: ID
}

input UserFilterInput {
  and: [UserFilterInput!]

  or: [UserFilterInput!]

  not: [UserFilterInput!]

  id: UserFilterId

  "用户邮箱（全局唯一，登录身份标识）"
  email: UserFilterEmail

  "是否平台管理员（全局标记）"
  isPlatformAdmin: UserFilterIsPlatformAdmin
}

type SignInResult {
  id: ID!

  "用户邮箱（全局唯一，登录身份标识）"
  email: String!

  "是否平台管理员（全局标记）"
  isPlatformAdmin: Boolean!

  "A JWT which the user can use to authenticate to the API."
  token: String!
}

type User {
  id: ID!

  "用户邮箱（全局唯一，登录身份标识）"
  email: String!

  "是否平台管理员（全局标记）"
  isPlatformAdmin: Boolean!
}

type RootQueryType {
  "Placeholder query until the first resource is added"
  ping: String
}

type RootMutationType {
  "Register a new user with a username and password."
  signUp(input: SignUpInput!): SignUpResult!

  "使用邮箱密码登录，成功后返回用户及 JWT token"
  signIn(
    "A filter to limit the results"
    filter: UserFilterInput

    "The identity to use for retrieving the user."
    email: String!

    "The password to check for the matching user."
    password: String!
  ): SignInResult
}

"""
The `Json` scalar type represents arbitrary json string data, represented as UTF-8
character sequences. The Json type is most often used to represent a free-form
human-readable json string.
"""
scalar Json
