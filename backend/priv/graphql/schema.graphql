schema {
  mutation: RootMutationType
  query: RootQueryType
}

"An error generated by a failed mutation"
type MutationError {
  "The human readable error message"
  message: String

  "A shorter error message, with vars not replaced"
  shortMessage: String

  "Replacements for the short message"
  vars: Json

  "An error code for the given error"
  code: String

  "The field or fields that produced the error"
  fields: [String!]

  "The path to the field that produced the error"
  path: [String!]
}

"The result of the :update_workspace mutation"
type UpdateWorkspaceResult {
  "The successful result of the mutation"
  result: Workspace

  "Any errors generated, if the mutation failed"
  errors: [MutationError!]!
}

input UpdateWorkspaceInput {
  "工作台唯一标识（小写字母\/数字\/连字符，创建者提供）"
  slug: String

  "工作台名称"
  name: String

  "加入策略：open 公开直接加入 \/ request 公开申请审批 \/ invite_only 私密仅邀请"
  joinPolicy: String

  "是否开放赞助入口（默认开）"
  sponsorshipEnabled: Boolean
}

"The result of the :create_workspace mutation"
type CreateWorkspaceResult {
  "The successful result of the mutation"
  result: Workspace

  "Any errors generated, if the mutation failed"
  errors: [MutationError!]!
}

input CreateWorkspaceInput {
  "工作台唯一标识（小写字母\/数字\/连字符，创建者提供）"
  slug: String!

  "工作台名称"
  name: String!

  "加入策略：open 公开直接加入 \/ request 公开申请审批 \/ invite_only 私密仅邀请"
  joinPolicy: String

  "是否开放赞助入口（默认开）"
  sponsorshipEnabled: Boolean
}

input WorkspaceFilterSponsorshipEnabled {
  isNil: Boolean
  eq: Boolean
  notEq: Boolean
  in: [Boolean!]
  lessThan: Boolean
  greaterThan: Boolean
  lessThanOrEqual: Boolean
  greaterThanOrEqual: Boolean
  isDistinctFrom: Boolean
  isNotDistinctFrom: Boolean
}

input WorkspaceFilterJoinPolicy {
  isNil: Boolean
  eq: String
  notEq: String
  in: [String!]
  lessThan: String
  greaterThan: String
  lessThanOrEqual: String
  greaterThanOrEqual: String
  isDistinctFrom: String
  isNotDistinctFrom: String
}

input WorkspaceFilterName {
  isNil: Boolean
  eq: String
  notEq: String
  in: [String!]
  lessThan: String
  greaterThan: String
  lessThanOrEqual: String
  greaterThanOrEqual: String
  contains: String
  isDistinctFrom: String
  isNotDistinctFrom: String
  stringEndsWith: String
  stringStartsWith: String
  like: String
  ilike: String
}

input WorkspaceFilterSlug {
  isNil: Boolean
  eq: String
  notEq: String
  in: [String!]
  lessThan: String
  greaterThan: String
  lessThanOrEqual: String
  greaterThanOrEqual: String
  contains: String
  isDistinctFrom: String
  isNotDistinctFrom: String
  stringEndsWith: String
  stringStartsWith: String
  like: String
  ilike: String
}

input WorkspaceFilterId {
  isNil: Boolean
  eq: ID
  notEq: ID
  in: [ID!]
  lessThan: ID
  greaterThan: ID
  lessThanOrEqual: ID
  greaterThanOrEqual: ID
  isDistinctFrom: ID
  isNotDistinctFrom: ID
}

input WorkspaceFilterInput {
  and: [WorkspaceFilterInput!]

  or: [WorkspaceFilterInput!]

  not: [WorkspaceFilterInput!]

  id: WorkspaceFilterId

  "工作台唯一标识（小写字母\/数字\/连字符，创建者提供）"
  slug: WorkspaceFilterSlug

  "工作台名称"
  name: WorkspaceFilterName

  "加入策略：open 公开直接加入 \/ request 公开申请审批 \/ invite_only 私密仅邀请"
  joinPolicy: WorkspaceFilterJoinPolicy

  "是否开放赞助入口（默认开）"
  sponsorshipEnabled: WorkspaceFilterSponsorshipEnabled
}

type Workspace {
  id: ID!

  "工作台唯一标识（小写字母\/数字\/连字符，创建者提供）"
  slug: String!

  "工作台名称"
  name: String!

  "加入策略：open 公开直接加入 \/ request 公开申请审批 \/ invite_only 私密仅邀请"
  joinPolicy: String!

  "是否开放赞助入口（默认开）"
  sponsorshipEnabled: Boolean!
}

type SignUpMetadata {
  "A JWT which the user can use to authenticate to the API."
  token: String!
}

"The result of the :sign_up mutation"
type SignUpResult {
  "The successful result of the mutation"
  result: User

  "Any errors generated, if the mutation failed"
  errors: [MutationError!]!

  "Metadata produced by the mutation"
  metadata: SignUpMetadata
}

input SignUpInput {
  "用户邮箱（全局唯一，登录身份标识）"
  email: String!

  "The proposed password for the user, in plain text."
  password: String!
}

input UserFilterIsPlatformAdmin {
  isNil: Boolean
  eq: Boolean
  notEq: Boolean
  in: [Boolean!]
  lessThan: Boolean
  greaterThan: Boolean
  lessThanOrEqual: Boolean
  greaterThanOrEqual: Boolean
  isDistinctFrom: Boolean
  isNotDistinctFrom: Boolean
}

input UserFilterEmail {
  isNil: Boolean
  eq: String
  notEq: String
  in: [String!]
  lessThan: String
  greaterThan: String
  lessThanOrEqual: String
  greaterThanOrEqual: String
  contains: String
  isDistinctFrom: String
  isNotDistinctFrom: String
  stringEndsWith: String
  stringStartsWith: String
}

input UserFilterId {
  isNil: Boolean
  eq: ID
  notEq: ID
  in: [ID!]
  lessThan: ID
  greaterThan: ID
  lessThanOrEqual: ID
  greaterThanOrEqual: ID
  isDistinctFrom: ID
  isNotDistinctFrom: ID
}

input UserFilterInput {
  and: [UserFilterInput!]

  or: [UserFilterInput!]

  not: [UserFilterInput!]

  id: UserFilterId

  "用户邮箱（全局唯一，登录身份标识）"
  email: UserFilterEmail

  "是否平台管理员（全局标记）"
  isPlatformAdmin: UserFilterIsPlatformAdmin
}

type SignInResult {
  id: ID!

  "用户邮箱（全局唯一，登录身份标识）"
  email: String!

  "是否平台管理员（全局标记）"
  isPlatformAdmin: Boolean!

  "A JWT which the user can use to authenticate to the API."
  token: String!
}

type User {
  id: ID!

  "用户邮箱（全局唯一，登录身份标识）"
  email: String!

  "是否平台管理员（全局标记）"
  isPlatformAdmin: Boolean!
}

type RootQueryType {
  "Placeholder query until the first resource is added"
  ping: String

  "按 slug 获取工作台（需登录）"
  getWorkspace(
    "A filter to limit the results"
    filter: WorkspaceFilterInput

    slug: String!
  ): Workspace

  "按 id 获取工作台（需登录）"
  getWorkspaceById(
    "A filter to limit the results"
    filter: WorkspaceFilterInput

    id: ID!
  ): Workspace
}

type RootMutationType {
  "Register a new user with a username and password."
  signUp(input: SignUpInput!): SignUpResult!

  "使用邮箱密码登录，成功后返回用户及 JWT token"
  signIn(
    "A filter to limit the results"
    filter: UserFilterInput

    "The identity to use for retrieving the user."
    email: String!

    "The password to check for the matching user."
    password: String!
  ): SignInResult

  "创建工作台（仅平台管理员）"
  createWorkspace(input: CreateWorkspaceInput!): CreateWorkspaceResult!

  "更新工作台（平台管理员）"
  updateWorkspace(id: ID!, input: UpdateWorkspaceInput): UpdateWorkspaceResult!
}

"""
The `Json` scalar type represents arbitrary json string data, represented as UTF-8
character sequences. The Json type is most often used to represent a free-form
human-readable json string.
"""
scalar Json
