"14" textLength="351.545">CreateOutline / PrepareRecruitMaterials / OpenQnA</text></g><!--entity C1--><g class="entity" data-qualified-name="POC .............D-A2b PASS..C1" id="ent0010" data-source-line="27"><rect x="22.11" y="86.738" width="345.773" height="52.977" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="32.11" y="110.273" fill="#000" font-size="14" textLength="93.406">实例 course_1</text><text x="32.11" y="126.762" fill="#000" font-size="14" textLength="325.773">input: course_id=course_1, title=公文写作训练营</text></g><!--entity C2--><g class="entity" data-qualified-name="POC .............D-A2b PASS..C2" id="ent0011" data-source-line="28"><rect x="403.05" y="86.738" width="321.896" height="52.977" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="413.05" y="110.273" fill="#000" font-size="14" textLength="93.406">实例 course_2</text><text x="413.05" y="126.762" fill="#000" font-size="14" textLength="301.896">input: course_id=course_2, title=AI 赋能教研</text></g><!--entity O1--><g class="entity" data-qualified-name="POC .............D-A2b PASS..O1" id="ent0012" data-source-line="29"><rect x="63.51" y="248.198" width="234.977" height="52.977" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="73.51" y="271.733" fill="#000" font-size="14" textLength="93.406">产物 course_1</text><text x="73.51" y="288.222" fill="#000" font-size="14" textLength="214.977">【course_1】招生开启，欢迎报名</text></g><!--entity O2--><g class="entity" data-qualified-name="POC .............D-A2b PASS..O2" id="ent0013" data-source-line="30"><rect x="355.51" y="248.198" width="234.977" height="52.977" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="365.51" y="271.733" fill="#000" font-size="14" textLength="93.406">产物 course_2</text><text x="365.51" y="288.222" fill="#000" font-size="14" textLength="214.977">【course_2】招生开启，欢迎报名</text></g><g class="entity" data-qualified-name="G