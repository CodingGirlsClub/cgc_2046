name: Desktop Release

# 内测分发（ADR-0027）：打 `desktop-v*` tag 时把三平台安装包挂到 GitHub Release。
#
# 为什么是 prerelease：产物未签名/未公证（签名与公证归 epic-6）。macOS 用户用浏览器
# 下载会被 quarantine 拦，Windows 会报 SmartScreen，所以只作内部测试通道，不对外发版。
#
# 为什么不在本 workflow 里跑测试：tag 指向的提交必须已在 develop/main 上（下面有
# 断言），它的完整 CI 已经跑过；这里只负责「用同一份源码把包打出来并发布」。
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 tag（形如 desktop-v0.1.0）"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # 发布前 schema 兼容门（#1183）：客户端先于后端发布时，登录等 API 在生产不存在，
  # GraphQL 返回 Cannot query field，客户端只会显示「网络异常」。fail-closed：
  # 生产 schema 缺任一字段就拒绝出包，避免再发一个登录不可用的内测包。
  schema-gate:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: 校验生产后端 schema 兼容
        working-directory: desktop
        run: |
          python3 scripts/check_release_schema.py --self-test
          python3 scripts/check_release_schema.py

  build:
    needs: schema-gate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 出 universal 包：Intel Mac 用户也要能装，且用户不该自己挑架构。
          - os: macos-15
            formats: dmg
            artifact_arch: universal
          - os: windows-2022
            formats: wix
            artifact_arch: ""
          - os: ubuntu-24.04
            formats: deb,appimage
            artifact_arch: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CGC_ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master @ 2026-10-16
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop -> target"
      - name: Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang libfontconfig-dev libwayland-dev \
            libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev libasound2-dev vulkan-validationlayers libvulkan1 \
            fuse libfuse2t64
      # 发布物必须过同一把许可门禁（AGENTS.md 硬规则）；结论与平台无关，只在 macOS 跑。
      - name: 依赖许可门禁
        if: runner.os == 'macOS'
        run: |
          python3 scripts/check_licenses.py --self-test
          python3 scripts/check_licenses.py
      - name: 缓存 cargo-packager
        id: packager-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-packager*
          key: ${{ runner.os }}-${{ runner.arch }}
      - name: 安装 cargo-packager
        if: steps.packager-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-packager --locked --version =0.11.8
      - name: 打包（Windows / Linux）
        if: runner.os != 'macOS'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          CGC_DEFAULT_API_URL: https://api.codingirlsclub.com/api/graphql
          CGC_DEFAULT_ENV: prod
        run: cargo packager -p cgc-desktop-app --release -f ${{ matrix.formats }}
      - name: 打包（macOS universal）
        if: runner.os == 'macOS'
        env:
          CGC_DEFAULT_API_URL: https://api.codingirlsclub.com/api/graphql
          CGC_DEFAULT_ENV: prod
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --release -p cgc-desktop-app --target aarch64-apple-darwin
          cargo build --release -p cgc-desktop-app --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/cgc-desktop-app \
            target/aarch64-apple-darwin/release/cgc-desktop-app \
            target/x86_64-apple-darwin/release/cgc-desktop-app
          lipo -archs target/universal-apple-darwin/release/cgc-desktop-app
          cargo packager -p cgc-desktop-app --release --target universal-apple-darwin -f dmg
      - name: 重命名产物（Unix）
        if: runner.os != 'Windows'
        run: bash scripts/name-artifacts.sh
      - name: 重命名产物（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/name-artifacts.ps1
      - name: 校验产物（Unix）
        if: runner.os != 'Windows'
        run: bash scripts/verify-package.sh
      - name: 校验产物（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: desktop/dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    permissions:
      contents: write  # 上传 Release 资产
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: 校验 tag 与包版本一致
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          tag_version="${TAG#desktop-v}"
          version=$(python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path("desktop/Cargo.toml").read_text()
          # [workspace.package] 里的 version 就是桌面端版本
          match = re.search(r'^version\s*=\s*"([^"]+)"', text, re.M)
          print(match.group(1) if match else "")
          PY
          )
          if [ -z "$version" ] || [ "$tag_version" != "$version" ]; then
            echo "FAIL: tag '$TAG' 与 desktop 包版本 '$version' 不一致" >&2
            exit 1
          fi
          echo "version ok: $version"
      - name: 确认 tag 指向已合并的提交
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          git fetch --no-tags origin develop main
          sha=$(git rev-parse "$TAG^{commit}")
          if git merge-base --is-ancestor "$sha" origin/develop || git merge-base --is-ancestor "$sha" origin/main; then
            echo "commit ok: $sha 已在 develop/main"
          else
            echo "FAIL: $sha 不在 develop/main 上——内测包只能从已合并的提交出" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: 列产物并生成校验和
        run: |
          ls -lh dist
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: 生成发布说明
        run: |
          notes="$RUNNER_TEMP/notes.md"
          {
            cat <<'MD'
          ## 程序媛汇 · 桌面客户端（内测）

          未签名、未公证的构建，仅供内部测试（签名与公证归 epic-6）。

          ### 下载哪个包

          | 平台 | 下载文件 | 说明 |
          |---|---|---|
          MD
            for f in dist/*.dmg; do
              [ -e "$f" ] || continue
              printf '| macOS（Apple Silicon / Intel 通用） | `%s` | 拖进「应用程序」 |\n' "$(basename "$f")"
            done
            for f in dist/*.msi; do
              [ -e "$f" ] || continue
              printf '| **Windows x64** | **`%s`** | **双击安装** |\n' "$(basename "$f")"
            done
            for f in dist/*.deb; do
              [ -e "$f" ] || continue
              printf '| Linux（Debian / Ubuntu） | `%s` | 依赖 `libsecret-tools` |\n' "$(basename "$f")"
            done
            for f in dist/*.AppImage; do
              [ -e "$f" ] || continue
              printf '| Linux（通用） | `%s` | 无 FUSE 环境用 `--appimage-extract-and-run` |\n' "$(basename "$f")"
            done
            printf '| 校验 | `SHA256SUMS` | 下载后 `sha256sum -c SHA256SUMS` |\n'
            cat <<'MD'

          > 列表末尾的 `Source code (zip)` / `Source code (tar.gz)` 是 GitHub 自动附带的源码归档，不是安装包，不用下载。

          ### 安装
          - **macOS（universal，Apple Silicon 与 Intel 通用）**：拖进「应用程序」。
            用浏览器直接下载会被 Gatekeeper 拦（「已损坏，无法打开」），先执行
            `xattr -dr com.apple.quarantine "/Applications/程序媛汇.app"`；
            或用 `curl -LO` 下载（不会带 quarantine）。
          - **Windows x64**：双击 `.msi` 安装；SmartScreen 提示时选「更多信息 → 仍要运行」。
          - **Linux**：deb 依赖 `libsecret-tools`（登录凭证走 secret-tool）；
            AppImage 在无 FUSE 环境用 `--appimage-extract-and-run` 启动。

          ### 校验
          每个包旁边有 `SHA256SUMS`，下载后可 `sha256sum -c SHA256SUMS` 自查。

          ### 说明
          内测包把生产端点烘进了二进制（`https://api.codingirlsclub.com/api/graphql`）。
          安装包命名 `cgc2046_<version>_<commit>_<platform>-<arch>.<ext>`。
          MD
          } > "$notes"
          cat "$notes"
      - name: 发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --prerelease
