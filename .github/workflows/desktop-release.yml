name: Desktop Release

# 内测分发（ADR-0027）：打 `desktop-v*` tag 时把三平台安装包挂到 GitHub Release。
#
# 为什么是 prerelease：产物未签名/未公证（签名与公证归 epic-6）。macOS 用户用浏览器
# 下载会被 quarantine 拦，Windows 会报 SmartScreen，所以只作内部测试通道，不对外发版。
#
# 为什么不在本 workflow 里跑测试：tag 指向的提交必须已在 develop/main 上（下面有
# 断言），它的完整 CI 已经跑过；这里只负责「用同一份源码把包打出来并发布」。
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 tag（形如 desktop-v0.1.0）"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # 发布前 schema 兼容门（#1183）：客户端先于后端发布时，登录等 API 在生产不存在，
  # GraphQL 返回 Cannot query field，客户端只会显示「网络异常」。fail-closed：
  # 生产 schema 缺任一字段就拒绝出包，避免再发一个登录不可用的内测包。
  schema-gate:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: 校验生产后端 schema 兼容
        working-directory: desktop
        run: |
          python3 scripts/check_release_schema.py --self-test
          python3 scripts/check_release_schema.py

  build:
    needs: schema-gate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 出 universal 包：Intel Mac 用户也要能装，且用户不该自己挑架构。
          - os: macos-15
            formats: dmg
            archive: ""
            artifact_arch: universal
          # 内测包要「免安装」：Windows 出 zip、Linux 出 tar.gz（cargo-packager 没有这两种
          # 格式，先出 wix/deb 再解包重压）。未签名安装器会被 SmartScreen/签名检查拦，
          # 便携包只需要解压即可运行。
          - os: windows-2022
            formats: wix
            archive: zip
            artifact_arch: ""
          - os: ubuntu-24.04
            formats: deb
            archive: tar.gz
            artifact_arch: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CGC_ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master @ 2026-10-16
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop -> target"
      # libghostty-vt 的 build.rs 会调用 `zig build` 编译 ghostty 的 C 库；
      # 版本必须与 crates/terminal/README.md 记录的 0.17.1 一致。
      # 官方 tarball 解到 runner 临时目录，再用 job 级 `ZIG` 指过去：
      # 不写 GITHUB_PATH/GITHUB_ENV，避开 Windows 上 bash 与 Windows 路径混用的坑。
      - name: 安装 Zig 0.17.1
        shell: bash
        run: |
          set -euo pipefail
          version=0.17.1
          # 每个 tarball 的 SHA-256 来自官方 https://ziglang.org/download/index.json；
          # 升级 Zig 版本时必须同步更新（本地用 index.json 或实际下载核对）。
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            macOS-ARM64) asset="aarch64-macos"; sha256="75f1bc7a1e9852f17ec9a0c1895f767c4ec56d46bc8a834920eece1d0359dd8d" ;;
            macOS-X64)   asset="x86_64-macos";   sha256="9af07b20319fbd0c92ee46ad23e81d6a782b1aaea2cfb8dcbff35f1d2c7ddbb7" ;;
            Linux-X64)   asset="x86_64-linux";   sha256="3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a" ;;
            Windows-X64) asset="x86_64-windows"; sha256="b03f477a1943673e02aca0f570e8030dffd536ce1f45cbc4d3326ec31159562e" ;;
            *)
              echo "不支持的 runner：${RUNNER_OS}-${RUNNER_ARCH}" >&2
              exit 1
              ;;
          esac
          if [ "${RUNNER_OS}" = "Windows" ]; then
            archive="zig-${asset}-${version}.zip"
          else
            archive="zig-${asset}-${version}.tar.xz"
          fi
          dest="${RUNNER_TEMP}/zig"
          mkdir -p "$dest"
          curl -fsSL "https://ziglang.org/download/${version}/${archive}" \
            -o "${RUNNER_TEMP}/${archive}"
          if command -v sha256sum >/dev/null 2>&1; then
            actual_sha256=$(sha256sum "${RUNNER_TEMP}/${archive}" | awk '{print $1}' | tr -d '\\')
          else
            actual_sha256=$(shasum -a 256 "${RUNNER_TEMP}/${archive}" | awk '{print $1}' | tr -d '\\')
          fi
          if [ "${actual_sha256}" != "${sha256}" ]; then
            echo "Zig 校验失败：期望 ${sha256}，实际 ${actual_sha256}" >&2
            exit 1
          fi
          if [ "${RUNNER_OS}" = "Windows" ]; then
            7z x -y "${RUNNER_TEMP}/${archive}" -o"$dest" > /dev/null
          else
            tar -xf "${RUNNER_TEMP}/${archive}" -C "$dest"
          fi
          rm -rf "${dest}/zig"
          mv "${dest}/zig-${asset}-${version}" "${dest}/zig"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            "${dest}/zig/zig.exe" version
          else
            "${dest}/zig/zig" version
          fi
      - name: Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang libfontconfig-dev libwayland-dev \
            libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev libasound2-dev vulkan-validationlayers libvulkan1 \
            fuse libfuse2t64
      # 发布物必须过同一把许可门禁（AGENTS.md 硬规则）；结论与平台无关，只在 macOS 跑。
      - name: 依赖许可门禁
        if: runner.os == 'macOS'
        run: |
          python3 scripts/check_licenses.py --self-test
          python3 scripts/check_licenses.py
      - name: 缓存 cargo-packager
        id: packager-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-packager*
          key: ${{ runner.os }}-${{ runner.arch }}
      - name: 安装 cargo-packager
        if: steps.packager-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-packager --locked --version =0.11.8
      - name: 解析源码 commit（tag 的提交，不是 dispatch ref）
        id: src
        # Windows runner 默认 shell 是 pwsh，`$GITHUB_OUTPUT` 会当成 PowerShell 变量
        # （应为 `$env:GITHUB_OUTPUT`）展开为空，重定向失败会挂掉整个 matrix。显式 bash。
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: 打包（Windows / Linux）
        if: runner.os != 'macOS'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          CGC_DEFAULT_API_URL: https://api.codingirlsclub.com/api/graphql
          CGC_DEFAULT_ENV: prod
          ZIG: ${{ runner.temp }}/zig/zig/zig
        run: cargo packager -p cgc-desktop-app --release -f ${{ matrix.formats }}
      - name: 校验 PE 子系统（Windows GUI）
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-pe-subsystem.ps1
      - name: 打包（macOS universal）
        if: runner.os == 'macOS'
        env:
          CGC_DEFAULT_API_URL: https://api.codingirlsclub.com/api/graphql
          CGC_DEFAULT_ENV: prod
          ZIG: ${{ runner.temp }}/zig/zig/zig
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --release -p cgc-desktop-app --target aarch64-apple-darwin
          cargo build --release -p cgc-desktop-app --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/cgc-desktop-app \
            target/aarch64-apple-darwin/release/cgc-desktop-app \
            target/x86_64-apple-darwin/release/cgc-desktop-app
          lipo -archs target/universal-apple-darwin/release/cgc-desktop-app
          cargo packager -p cgc-desktop-app --release --target universal-apple-darwin -f dmg
      # 便携包：解开发行包再压缩，保证 DLL/资源与安装器内容一致（不靠手抄文件清单）。
      - name: 生成便携 tar.gz（解 deb）
        if: matrix.archive == 'tar.gz'
        run: |
          set -euo pipefail
          deb=$(ls dist/*.deb | head -1)
          stage=$(mktemp -d)
          dpkg-deb -x "$deb" "$stage"
          # 便携包不经安装器，协议注册要用户解压后手动跑一次这个脚本。
          cp scripts/register-protocol.sh "$stage/usr/bin/register-protocol.sh"
          chmod +x "$stage/usr/bin/register-protocol.sh"
          tar -czf dist/cgc2046-linux-portable.tar.gz -C "$stage" .
          rm -f "$deb"
          rm -rf "$stage"
          ls -l dist/
      - name: 生成便携 zip（解 msi）
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $msi = Get-ChildItem dist -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw "FAIL: dist 下没有 msi" }
          $stage = Join-Path $env:RUNNER_TEMP "cgc-portable"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          # 必须用 msiexec /a（administrative install）：MSI 的 cabinet 里存的是 File 表的键，
          # WiX 模板把主可执行文件的 id 设为 `Path`，直接 7z 解出来会得到 `Path` 这类键名、
          # 且没有安装后的目录布局。administrative install 会按 MSI 表还原真实路径。
          $args = @("/a", "`"$($msi.FullName)`"", "/qn", "TARGETDIR=`"$stage`"")
          $proc = Start-Process msiexec.exe -ArgumentList $args -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "msiexec /a 失败，exit=$($proc.ExitCode)" }
          $exe = Get-ChildItem -Path $stage -Recurse -Filter "cgc-desktop-app.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "administrative install 后找不到 cgc-desktop-app.exe（MSI 布局与预期不符）" }
          # administrative install 会按 MSI 的 Program Files 布局还原，exe 落在
          # PFiles/<程序名>/ 下；这里把它提到包根，用户解压后第一眼就能看到。
          # 同目录若有 DLL/资源，一并搬走以保持相对关系。
          $appDir = Split-Path -Parent $exe.FullName
          Get-ChildItem -Path $appDir -Force | Move-Item -Destination $stage -Force
          Get-ChildItem -Path $stage -Directory -Filter "PFiles" -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force
          # administrative install 会把 msi 自身复制进目标目录，去掉它（便携包不需要安装器）。
          Get-ChildItem -Path $stage -Filter *.msi -Recurse -ErrorAction SilentlyContinue | Remove-Item -Force
          if (-not (Test-Path (Join-Path $stage "cgc-desktop-app.exe"))) {
            throw "FAIL: exe 未落到包根（用户解压后会看不到）"
          }
          Write-Host "staged exe: $(Join-Path $stage 'cgc-desktop-app.exe')"
          Copy-Item scripts/register-protocol.ps1 -Destination (Join-Path $stage "register-protocol.ps1") -Force
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath "dist/cgc2046-windows-portable.zip" -Force
          Remove-Item $msi.FullName -Force
          Get-ChildItem dist
      - name: 重命名产物（Unix）
        if: runner.os != 'Windows'
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
          CGC_BUILD_COMMIT: ${{ steps.src.outputs.sha }}
          CGC_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          export VERSION="${VERSION#desktop-v}"
          bash scripts/name-artifacts.sh
      - name: 重命名产物（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
          CGC_BUILD_COMMIT: ${{ steps.src.outputs.sha }}
          CGC_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $env:VERSION = $env:VERSION -replace '^desktop-v', ''
          ./scripts/name-artifacts.ps1
      - name: 校验产物（Unix）
        if: runner.os != 'Windows'
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
          CGC_BUILD_COMMIT: ${{ steps.src.outputs.sha }}
        run: |
          export VERSION="${VERSION#desktop-v}"
          bash scripts/verify-package.sh
      - name: 校验产物（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
          CGC_BUILD_COMMIT: ${{ steps.src.outputs.sha }}
        run: |
          $env:VERSION = $env:VERSION -replace '^desktop-v', ''
          ./scripts/verify-package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: desktop/dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    permissions:
      contents: write  # 上传 Release 资产
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: 校验 tag 与包版本一致
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          tag_version="${TAG#desktop-v}"
          # 允许 semver prerelease：0.1.0 / 0.1.0-dev.20261102.1（后者是内测构建）。
          if ! [[ "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "FAIL: tag '$TAG' 不是合法版本（期望 desktop-v<X.Y.Z>[-<prerelease>]）" >&2
            exit 1
          fi
          base="${tag_version%%-*}"
          version=$(python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path("desktop/Cargo.toml").read_text()
          # [workspace.package] 里的 version 就是桌面端 base 版本
          match = re.search(r'^version\s*=\s*"([^"]+)"', text, re.M)
          print(match.group(1) if match else "")
          PY
          )
          if [ -z "$version" ] || [ "$base" != "$version" ]; then
            echo "FAIL: tag '$TAG' 的 base '$base' 与 desktop 包版本 '$version' 不一致" >&2
            exit 1
          fi
          echo "version ok: $tag_version（base $base）"
      - name: 确认 tag 指向已合并的提交
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          git fetch --no-tags origin develop main
          sha=$(git rev-parse "$TAG^{commit}")
          if git merge-base --is-ancestor "$sha" origin/develop || git merge-base --is-ancestor "$sha" origin/main; then
            echo "commit ok: $sha 已在 develop/main"
          else
            echo "FAIL: $sha 不在 develop/main 上——内测包只能从已合并的提交出" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: 列产物并生成校验和
        run: |
          ls -lh dist
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: 生成发布说明
        run: |
          notes="$RUNNER_TEMP/notes.md"
          {
            cat <<'MD'
          ## 程序媛汇 · 桌面客户端（内测）

          未签名、未公证的构建，仅供内部测试（签名与公证归 epic-6）。

          ### 下载哪个包

          | 平台 | 下载文件 | 说明 |
          |---|---|---|
          MD
            for f in dist/*.dmg; do
              [ -e "$f" ] || continue
              printf '| macOS（Apple Silicon / Intel 通用） | `%s` | 拖进「应用程序」 |\n' "$(basename "$f")"
            done
            for f in dist/*.zip; do
              [ -e "$f" ] || continue
              printf '| **Windows x64** | **`%s`** | **解压即用（便携包）** |\n' "$(basename "$f")"
            done
            for f in dist/*.tar.gz; do
              [ -e "$f" ] || continue
              printf '| Linux（x64） | `%s` | 解压即用（便携包） |\n' "$(basename "$f")"
            done
            printf '| 校验 | `SHA256SUMS` | 下载后 `sha256sum -c SHA256SUMS` |\n'
            cat <<'MD'

          > 列表末尾的 `Source code (zip)` / `Source code (tar.gz)` 是 GitHub 自动附带的源码归档，不是安装包，不用下载。

          ### 安装
          - **macOS（universal，Apple Silicon 与 Intel 通用）**：拖进「应用程序」。
            用浏览器直接下载会被 Gatekeeper 拦（「已损坏，无法打开」），先执行
            `xattr -dr com.apple.quarantine "/Applications/程序媛汇.app"`；
            或用 `curl -LO` 下载（不会带 quarantine）。
          - **Windows x64**：解压 `.zip` 到任意目录，双击其中的 `cgc-desktop-app.exe`。
            首次运行 SmartScreen 会提示，选「更多信息 → 仍要运行」。不需要安装、不需要管理员权限。
          - **Linux（x64）**：解压 `.tar.gz` 后直接运行其中的 `cgc-desktop-app`。
            登录凭证走 secret-tool，需要系统装有 `libsecret-tools`
            （Debian/Ubuntu：`sudo apt install libsecret-tools`）。不需要安装、不需要 root。

          > **便携包不注册 `cgc://` 深链**（那原本由安装器完成）。要让网页里的链接能跳回客户端，
          > 解压后跑一次随包脚本：Windows `powershell -ExecutionPolicy Bypass -File register-protocol.ps1`；
          > Linux `bash usr/bin/register-protocol.sh`。都只写当前用户，不需要管理员/root。

          ### 校验
          每个包旁边有 `SHA256SUMS`，下载后可 `sha256sum -c SHA256SUMS` 自查。
          产物同名 `.build.json` 记录 `version` / `sourceRevision` / `platform` / `arch` / 签名状态。

          ### 说明
          内测包把生产端点烘进了二进制（`https://api.codingirlsclub.com/api/graphql`）。
          产物命名 `cgc2046-<platform>-<arch>.<ext>`，**文件名不带版本**；版本、源码 commit 与
          签名状态写在各产物同名的 `.build.json` 里，下载后 `cat` 一下即可确认是哪个构建。
          MD
          } > "$notes"
          cat "$notes"
      - name: 发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --prerelease
