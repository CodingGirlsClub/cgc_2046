# CD：main 分支 → Kamal 构建双镜像推 TCR → 零停机部署
# 前置（服务器初始化，一次性）：
#   1. Docker + Kamal 首次 boot（kamal setup 或手动 docker run kamal-proxy）
#   2. GitHub production environment 补 4 个值：
#      secrets: SERVER_SSH_KEY, KAMAL_REGISTRY_PASSWORD, DATABASE_URL
#      vars:    TCR_REGISTRY, TCR_USERNAME, SERVER_HOST, SERVER_HOST_KEY
# 环境注入契约：docs/运维/邮件与CD环境注入.md
#
# 质量门：main 禁直推 + required PR（4 checks strict）——进 main 的代码
# 必然已过 CI，故 deploy 保持 push 触发即可，无需 workflow_run 二次等待。
#
# 拓扑：backend / web 两个 job 并行（共享 kamal-proxy 但操作各自 service，
# 配置按 service 隔离）；smoke 在两者都成功后执行。公共 setup（checkout/
# ruby/kamal/SSH）各 job 独立重复——GHA 不支持 YAML anchors，重复即显式。

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    # 全量 deploy 实测 ~10min（deps 镜像命中后 ~4min）；首次构建 deps 镜像
    # 多 ~5-8min。挂死类故障快速暴露
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - run: gem install kamal --no-document
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # 新装系统 host key 已换新；显式写入当前指纹，绕开 known_hosts
          # 哈希条目与 Net::SSH 的读取兼容问题
          echo "${{ vars.SERVER_HOST }} ssh-ed25519 ${{ vars.SERVER_HOST_KEY }}" > ~/.ssh/known_hosts

      # Kamal env.secret 从 .kamal/secrets（dotenv）解析而非进程 env——
      # CI 侧必须生成该文件（含 backend 全部 secret 注入源）
      - name: Write .kamal/secrets (backend)
        working-directory: backend
        run: |
          # 不带引号的 heredoc：bash 展开 ${VAR} 写入真值——dotenv 读到的是
          # 字面值，绕开 ${VAR} 引用链上 runner→服务器传参的任何环节
          cat > .kamal/secrets <<SECRETS_EOF
          KAMAL_REGISTRY_PASSWORD=${KAMAL_REGISTRY_PASSWORD}
          DATABASE_URL=${DATABASE_URL}
          SECRET_KEY_BASE=${SECRET_KEY_BASE}
          TOKEN_SIGNING_SECRET=${TOKEN_SIGNING_SECRET}
          SENDCLOUD_API_USER=${SENDCLOUD_API_USER}
          SENDCLOUD_API_KEY=${SENDCLOUD_API_KEY}
          SENDCLOUD_FROM=${SENDCLOUD_FROM}
          SENDCLOUD_FROM_NAME=${SENDCLOUD_FROM_NAME}
          SENDCLOUD_SMS_USER=${SENDCLOUD_SMS_USER}
          SENDCLOUD_SMS_KEY=${SENDCLOUD_SMS_KEY}
          SENDCLOUD_SMS_TEMPLATE_ID=${SENDCLOUD_SMS_TEMPLATE_ID}
          WEB_BASE_URL=${WEB_BASE_URL}
          CORS_ORIGIN=${CORS_ORIGIN}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          WECHAT_PAY_MCH_ID=${WECHAT_PAY_MCH_ID}
          WECHAT_PAY_APPID=${WECHAT_PAY_APPID}
          WECHAT_PAY_API_V3_KEY=${WECHAT_PAY_API_V3_KEY}
          WECHAT_PAY_API_V2_KEY=${WECHAT_PAY_API_V2_KEY}
          WECHAT_PAY_CLIENT_SERIAL_NO=${WECHAT_PAY_CLIENT_SERIAL_NO}
          WECHAT_PAY_CLIENT_PRIVATE_KEY=${WECHAT_PAY_CLIENT_PRIVATE_KEY}
          PAYMENTS_WEBHOOK_BASE_URL=${PAYMENTS_WEBHOOK_BASE_URL}
          ALIPAY_APP_ID=${ALIPAY_APP_ID}
          ALIPAY_PRIVATE_KEY=${ALIPAY_PRIVATE_KEY}
          ALIPAY_PUBLIC_KEY=${ALIPAY_PUBLIC_KEY}
          ALIPAY_SANDBOX=${ALIPAY_SANDBOX}
          WECHAT_WEB_APPID=${WECHAT_WEB_APPID}
          WECHAT_WEB_SECRET=${WECHAT_WEB_SECRET}
          SECRETS_EOF
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          TOKEN_SIGNING_SECRET: ${{ secrets.TOKEN_SIGNING_SECRET }}
          SENDCLOUD_API_USER: ${{ secrets.SENDCLOUD_API_USER }}
          SENDCLOUD_API_KEY: ${{ secrets.SENDCLOUD_API_KEY }}
          SENDCLOUD_FROM: ${{ vars.SENDCLOUD_FROM }}
          SENDCLOUD_FROM_NAME: ${{ vars.SENDCLOUD_FROM_NAME }}
          SENDCLOUD_SMS_USER: ${{ secrets.SENDCLOUD_SMS_USER }}
          SENDCLOUD_SMS_KEY: ${{ secrets.SENDCLOUD_SMS_KEY }}
          SENDCLOUD_SMS_TEMPLATE_ID: ${{ vars.SENDCLOUD_SMS_TEMPLATE_ID }}
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          WECHAT_PAY_MCH_ID: ${{ vars.WECHAT_PAY_MCH_ID }}
          WECHAT_PAY_APPID: ${{ vars.WECHAT_PAY_APPID }}
          WECHAT_PAY_API_V3_KEY: ${{ secrets.WECHAT_PAY_API_V3_KEY }}
          WECHAT_PAY_API_V2_KEY: ${{ secrets.WECHAT_PAY_API_V2_KEY }}
          WECHAT_PAY_CLIENT_SERIAL_NO: ${{ vars.WECHAT_PAY_CLIENT_SERIAL_NO }}
          WECHAT_PAY_CLIENT_PRIVATE_KEY: ${{ secrets.WECHAT_PAY_CLIENT_PRIVATE_KEY }}
          PAYMENTS_WEBHOOK_BASE_URL: ${{ vars.PAYMENTS_WEBHOOK_BASE_URL }}
          ALIPAY_APP_ID: ${{ vars.ALIPAY_APP_ID }}
          ALIPAY_PRIVATE_KEY: ${{ secrets.ALIPAY_PRIVATE_KEY }}
          ALIPAY_PUBLIC_KEY: ${{ secrets.ALIPAY_PUBLIC_KEY }}
          ALIPAY_SANDBOX: ${{ vars.ALIPAY_SANDBOX }}
          WECHAT_WEB_APPID: ${{ vars.WECHAT_WEB_APPID }}
          WECHAT_WEB_SECRET: ${{ secrets.WECHAT_WEB_SECRET }}
      - name: Deploy backend
        working-directory: backend
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          # Kamal env.secret 注入源：runner 进程环境
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          TOKEN_SIGNING_SECRET: ${{ secrets.TOKEN_SIGNING_SECRET }}
          SENDCLOUD_API_USER: ${{ secrets.SENDCLOUD_API_USER }}
          SENDCLOUD_API_KEY: ${{ secrets.SENDCLOUD_API_KEY }}
          SENDCLOUD_FROM: ${{ vars.SENDCLOUD_FROM }}
          SENDCLOUD_FROM_NAME: ${{ vars.SENDCLOUD_FROM_NAME }}
          SENDCLOUD_SMS_USER: ${{ secrets.SENDCLOUD_SMS_USER }}
          SENDCLOUD_SMS_KEY: ${{ secrets.SENDCLOUD_SMS_KEY }}
          SENDCLOUD_SMS_TEMPLATE_ID: ${{ vars.SENDCLOUD_SMS_TEMPLATE_ID }}
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
        run: |
          # sed 到临时副本：工作区保持干净，避免 Kamal dirty tag
          sed -e "s|<TCR_REGISTRY>|${{ vars.TCR_REGISTRY }}|" \
              -e "s|<TCR_USERNAME>|\"${{ vars.TCR_USERNAME }}\"|" \
              -e "s|<SERVER_HOST>|\"${{ vars.SERVER_HOST }}\"|" \
              config/deploy.yml > config/deploy.ci.yml
          # 显式 login（runner 本地 + 服务器）：隔离 deploy 内部 login，
          # 失败信息直指凭证链而非埋在 build 之后
          kamal registry login -c config/deploy.ci.yml
          # deps 基础镜像（Dockerfile.deps）：tag=mix.lock 哈希。命中则跳过
          # deps 编译（部署提速大头）；缺失则构建推送（仅 mix.lock 变更时，
          # 一次性 ~5min）。manifest inspect 依赖上面的 registry login
          LOCK_HASH=$(sha256sum mix.lock | cut -c1-16)
          DEPS_IMAGE="${{ vars.TCR_REGISTRY }}/codingirlsclub/cgc2046-backend-deps:${LOCK_HASH}"
          if docker manifest inspect "$DEPS_IMAGE" > /dev/null 2>&1; then
            echo "deps 镜像命中（mix.lock 未变）：$DEPS_IMAGE"
          else
            echo "deps 镜像缺失，构建并推送（mix.lock 变更后一次性）…"
            docker build -f Dockerfile.deps -t "$DEPS_IMAGE" ..
            docker push "$DEPS_IMAGE"
          fi
          # builder args 走 sed 占位符（Kamal 对 ${VAR} 零插值，实证）
          sed -i "s|<BACKEND_DEPS_IMAGE>|${DEPS_IMAGE}|" config/deploy.ci.yml
          grep -q "codingirlsclub/cgc2046-backend-deps" config/deploy.ci.yml
          # PG accessory 幂等 boot（首部署不存在则创建，已运行则 no-op）
          kamal accessory boot postgres -c config/deploy.ci.yml || true
          kamal deploy -c config/deploy.ci.yml

  # ── web：build（NEXT_PUBLIC_* 经 Kamal build_args 内联，#254）→ 部署 ──
  # 并行 job 独立 runner：registry login / SSH 不共享，必须各自执行
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - run: gem install kamal --no-document
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ vars.SERVER_HOST }} ssh-ed25519 ${{ vars.SERVER_HOST_KEY }}" > ~/.ssh/known_hosts

      - name: Write .kamal/secrets (web)
        working-directory: web
        run: |
          mkdir -p .kamal
          # 只剩 registry 密码走 secrets lookup；NEXT_PUBLIC_* / BACKEND_URL
          # 已由 builder args 经 sed 占位符直写 deploy.ci.yml（本文件不再消费）
          cat > .kamal/secrets <<SECRETS_EOF
          KAMAL_REGISTRY_PASSWORD=${KAMAL_REGISTRY_PASSWORD}
          SECRETS_EOF
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}

      - name: Deploy web
        working-directory: web
        run: |
          # builder args 与 registry/host 同走 sed 占位符（Kamal 对 ${VAR}
          # 零插值）；values 含斜杠，sed 用 | 分隔符
          sed -e "s|<TCR_REGISTRY>|${{ vars.TCR_REGISTRY }}|" \
              -e "s|<TCR_USERNAME>|\"${{ vars.TCR_USERNAME }}\"|" \
              -e "s|<SERVER_HOST>|\"${{ vars.SERVER_HOST }}\"|" \
              -e "s|<NEXT_PUBLIC_WEB_BASE_URL>|${{ vars.NEXT_PUBLIC_WEB_BASE_URL }}|" \
              -e "s|<BACKEND_URL>|${{ vars.BACKEND_URL }}|" \
              config/deploy.yml > config/deploy.ci.yml
          # 占位符必须全部替换——漏替换会把字面量 <...> 注入构建
          ! grep -q "<BACKEND_URL>\|<NEXT_PUBLIC_WEB_BASE_URL>" config/deploy.ci.yml
          # 并行 job 独立 runner：docker login 状态不共享，必须显式 login
          kamal registry login -c config/deploy.ci.yml
          kamal deploy -c config/deploy.ci.yml

  smoke:
    needs: [backend, web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Smoke check
        # --retry：ACME 首签窗口（Let's Encrypt 验证→证书就绪）内 TLS 握手
        # 可能瞬时失败；retry-all-errors 覆盖 SSL 层错误（curl 默认不重试）
        run: |
          sleep 10
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors \
            https://api.codingirlsclub.com/healthz
          curl -fsSI --retry 6 --retry-delay 5 --retry-all-errors \
            https://codingirlsclub.com/ | head -1
          # /ops 经主域 path 路由直达 backend：未登录期待 403（PlatformAdminPlug）；
          # 404 = 路由丢失到 web 前端（kamal-proxy path 规则失效，部署红线）
          OPS=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-all-errors \
            https://codingirlsclub.com/ops/admin)
          [ "$OPS" = "403" ] || { echo "FAIL: /ops/admin => $OPS (expect 403)"; exit 1; }
