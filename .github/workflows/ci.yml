name: CI

on:
  push:
    # 只跑 develop：merge 进 main 的内容已被 PR required checks(strict 模式)
    # 验证过同一 tree，main push 再跑是纯冗余；bypass merge 的兜底由
    # deploy smoke 承担
    branches: [develop]
  pull_request:
    # main 的 branch protection 要求 checks，PR→main 必须有来源。
    # 具体取舍在各 job 的 if：develop→main 复用 push 结果跳过；
    # feature→develop 与 fork PR 没有 push run 可复用，照常跑
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  # push 场景用 ref（同分支新 push 取消旧 run）；PR 场景用 head_ref。
  # 原来 fallback 到 run_id 等于每次 push 独立分组，旧 run 从不被取消
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # PR 去重：仅跳过「head 为本仓库 develop」的 PR（develop→main 发布 PR
    # 复用 develop push 的同 SHA 结论,required checks 按 SHA 认领）;
    # feature→develop、fork PR 没有 push run 可复用,照常跑
    if: >
      github.event_name == 'push' ||
      github.head_ref != 'develop' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      # CI 单环境：compile 与 test 共用 test 环境，消灭 dev+test 双份编译；
      # format/rbac/license 检查均环境无关
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          # runic（jido_runic 底层）要求 Elixir ~> 1.18（1.17 无内置 JSON.Encoder，
          # runic 编译崩溃）；1.20 + OTP 29 与本地开发环境完全对齐，避免版本错位
          elixir-version: "1.20"
          otp-version: "29"
      - uses: actions/cache@v6
        with:
          # deps+_build 缓存：compile 从零编 ~3.5min 降为增量；key 绑 mix.lock，
          # 依赖变更自动失效，restore-keys 允许跨 PR 复用同前缀缓存。
          # 注意：path 相对 repo 根解析（不受 defaults.run.working-directory
          # 影响），必须带 backend/ 前缀——无此前缀时路径不存在，保存阶段
          # Path Validation Error 静默跳过，cache 从未生效（2026-08-21 实证）
          path: |
            backend/deps
            backend/_build
          key: mix-1.20-otp29-test-${{ hashFiles('backend/mix.lock') }}
          restore-keys: |
            mix-1.20-otp29-test-
      - run: mix deps.get
      # format 提前到 compile 前：秒级检查先行，格式错误不必等分钟级编译才红
      # （.formatter.exs 的 import_deps 依赖 deps 已拉取，故置于 deps.get 之后）
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      # rbac/license 是项目内 mix task，需项目编译后才可执行
      - run: mix cgc2046.gen_rbac_contract --check
      - run: mix cgc2046.check_licenses
      # snapshot 门禁：Ash resource 定义与 resource_snapshots 漂移即红
      # （schema squash 后防止资源变更不带 snapshot 提交；纯文件比对，无需 DB）
      - run: mix ash_postgres.generate_migrations --check
      - run: mix test
        timeout-minutes: 15
  web:
    # PR 去重：同 backend job 的 if（仅 develop→main 发布 PR 跳过）
    if: >
      github.event_name == 'push' ||
      github.head_ref != 'develop' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      # pnpm/action-setup must run BEFORE setup-node so the `cache: pnpm`
      # resolver finds the pnpm binary. (Authorized adjustment per plan 006.)
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2  # 与 web/package.json 的 packageManager 对齐，消除版本漂移
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/cache@v6
        with:
          path: web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('web/pnpm-lock.yaml') }}-${{ hashFiles('web/**.[jt]s', 'web/**.[jt]sx') }}
          restore-keys: ${{ runner.os }}-nextjs-${{ hashFiles('web/pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:licenses
      - run: pnpm audit --prod --audit-level high
      - run: pnpm test
        timeout-minutes: 10
      # bb41dcc(#213 AC1) 起 build 缺 BACKEND_URL 显式失败；CI 构建验证传显式占位
      # （构建期仅决定 rewrites destination，不请求后端）。CI 仅验证构建可过——
      # 生产注入链尚不存在（#213 尾款），由独立 hotfix 补 deploy 三件套。
      - run: pnpm build
        env:
          BACKEND_URL: http://localhost:4000

  miniprogram:
    # PR 去重：同 backend job 的 if（仅 develop→main 发布 PR 跳过）
    if: >
      github.event_name == 'push' ||
      github.head_ref != 'develop' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    # 序列尾部新增 mock 构建冒烟（多一次 build:weapp），余量 20 → 25
    timeout-minutes: 25
    defaults:
      run:
        working-directory: miniprogram
    steps:
      - uses: actions/checkout@v7
      # pnpm/action-setup must run BEFORE setup-node so the `cache: pnpm`
      # resolver finds the pnpm binary. (Same ordering as the web job.)
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: miniprogram/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # 命令序列单一真源收敛到 miniprogram/package.json 的 check:ci：
      # codegen → git diff --exit-code（生成物漂移即红）→ typecheck → licenses
      # → test:unit → 三端 build → check:diversion → build:weapp:mock（e2e mock 构建冒烟）。
      # 本地 pnpm check:ci = CI，两处清单不可能漂移。全量 e2e 依赖微信开发者工具
      # CLI（e2e/journey.e2e.mjs），CI 无法运行，故只落 mock 构建冒烟。
      # check-graphql 不进 CI：脚本直连 dev 后端 introspection（localhost:4001），
      # CI 无后端在跑；契约漂移已由 codegen+diff 门禁覆盖，故仅留 dev 手工。
      - run: pnpm check:ci

  # CI 耗时实测（2026-08-14 run 31802814605）：backend job ≈10-11min，其中
  # compile 零缓存全量重编 4m45s + dev/test 双环境重复编译。上述缓存与
  # MIX_ENV=test 两项即为对症修复；web/miniprogram job 未动。

  # 密钥门禁：任何提交/分支不得含真实凭据（fail-closed）。
  # 用免费 MIT 许可的 gitleaks CLI 而非官方 action——官方 action 对组织仓库
  # 强制 GITLEAKS_LICENSE 商业许可；CLI 自取二进制，行为等价（检出即非零退出）。
  # 放行项仅 dev/test 静态 secret_key_base，见根目录 .gitleaks.toml。
  secrets:
    # PR 去重：同 backend job 的 if（仅 develop→main 发布 PR 跳过）
    if: >
      github.event_name == 'push' ||
      github.head_ref != 'develop' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # 扫历史需要完整 git 对象
      - name: Gitleaks scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --log-opts="--all" --config=.gitleaks.toml --no-banner
