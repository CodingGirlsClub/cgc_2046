name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          # runic（jido_runic 底层）要求 Elixir ~> 1.18（1.17 无内置 JSON.Encoder，
          # runic 编译崩溃）；1.20 + OTP 29 与本地开发环境完全对齐，避免版本错位
          elixir-version: "1.20"
          otp-version: "29"
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix cgc2046.gen_rbac_contract --check
      - run: mix cgc2046.check_licenses
      - run: mix test
        timeout-minutes: 15

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # pnpm/action-setup must run BEFORE setup-node so the `cache: pnpm`
      # resolver finds the pnpm binary. (Authorized adjustment per plan 006.)
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2  # 与 web/package.json 的 packageManager 对齐，消除版本漂移
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/cache@v4
        with:
          path: web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('web/pnpm-lock.yaml') }}-${{ hashFiles('web/**.[jt]s', 'web/**.[jt]sx') }}
          restore-keys: ${{ runner.os }}-nextjs-${{ hashFiles('web/pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:licenses
      - run: pnpm audit --prod --audit-level high
      - run: pnpm test
        timeout-minutes: 10
      - run: pnpm build

  miniprogram:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: miniprogram
    steps:
      - uses: actions/checkout@v4
      # pnpm/action-setup must run BEFORE setup-node so the `cache: pnpm`
      # resolver finds the pnpm binary. (Same ordering as the web job.)
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: miniprogram/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # 从 backend/priv/graphql/schema.graphql 重新生成 TS 类型，确保契约无漂移
      - run: pnpm codegen
      - run: pnpm typecheck
      - run: pnpm check:licenses
      - run: pnpm test:unit
      # 三端编译（Phase 4 才裁剪，现在不能破）
      - run: pnpm build:weapp
      - run: pnpm build:tt
      - run: pnpm build:xhs
      # 零导流红线（§2）：裁剪端产物 escape-aware 禁词断言
      - run: pnpm check:diversion
        timeout-minutes: 15
