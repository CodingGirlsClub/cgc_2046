# 一次性运维工作流：释放 Kamal deploy 残留锁并重部署受影响服务。
#
# 背景（2026-08-24 run 32750284694）：PR #311 的 Deploy web job 异常中断，
# 「Automatic deploy lock」残留（Locked by 空 @ 16:55:21Z, version 7dc70e1），
# PR #312 的 web deploy 撞死锁。Kamal 正常完成会自动释放；仅 job 被取消/
# runner 崩溃时残留。本工作流手动触发：release-lock → re-run deploy。
#
# 使用：Actions → Kamal unlock & redeploy → Run workflow（选 service）。
# 用后可删；或保留作偶发锁残留的运维通道（无密钥落仓，全部走 secrets/vars）。

name: Kamal unlock & redeploy

on:
  workflow_dispatch:
    inputs:
      service:
        description: "解锁后重部署的服务"
        type: choice
        options: [web, backend, both]
        default: web
      redeploy:
        description: "解锁后是否重跑部署（false = 仅解锁）"
        type: boolean
        default: true

concurrency:
  group: kamal-ops
  cancel-in-progress: false

jobs:
  unlock-and-redeploy:
    runs-on: ubuntu-latest
    environment: production
    # 分支保护只放行 main —— 本通道必须在 main 分支上 dispatch（SERVER_*
    # vars/secrets 在 production 环境，repo 级无副本，不能摘掉 environment）。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - run: gem install kamal --no-document

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ vars.SERVER_HOST }} ssh-ed25519 ${{ vars.SERVER_HOST_KEY }}" > ~/.ssh/known_hosts

      - name: Release stale deploy lock
        working-directory: web
        run: |
          # 两服务同 host 共享锁目录；用 web 配置解锁即可（仅读 host 与 ssh）
          sed -e "s|<TCR_REGISTRY>|${{ vars.TCR_REGISTRY }}|" \
              -e "s|<TCR_USERNAME>|\"${{ vars.TCR_USERNAME }}\"|" \
              -e "s|<SERVER_HOST>|\"${{ vars.SERVER_HOST }}\"|" \
              config/deploy.yml > config/deploy.ci.yml
          # 残留锁详情由 kamal 输出（Acquiring 时打印 Locked by/Version）；
          # 不裸 ssh（deploy.yml user=deploy，裸连 runner@ 必 publickey 拒绝）
          kamal lock release -c config/deploy.ci.yml || {
            echo "::error::kamal lock release 失败——锁文件可能无写权限，见上方锁内容"
            exit 1
          }

      - name: Redeploy web
        if: ${{ inputs.redeploy && (inputs.service == 'web' || inputs.service == 'both') }}
        working-directory: web
        timeout-minutes: 12
        run: |
          sed -e "s|<TCR_REGISTRY>|${{ vars.TCR_REGISTRY }}|" \
              -e "s|<TCR_USERNAME>|\"${{ vars.TCR_USERNAME }}\"|" \
              -e "s|<SERVER_HOST>|\"${{ vars.SERVER_HOST }}\"|" \
              -e "s|<NEXT_PUBLIC_WEB_BASE_URL>|${{ vars.NEXT_PUBLIC_WEB_BASE_URL }}|" \
              -e "s|<BACKEND_URL>|${{ vars.BACKEND_URL }}|" \
              config/deploy.yml > config/deploy.ci.yml
          ! grep -q "<BACKEND_URL>\|<NEXT_PUBLIC_WEB_BASE_URL>" config/deploy.ci.yml
          mkdir -p .kamal
          cat > .kamal/secrets <<SECRETS_EOF
          KAMAL_REGISTRY_PASSWORD=${KAMAL_REGISTRY_PASSWORD}
          SECRETS_EOF
          kamal registry login -c config/deploy.ci.yml
          kamal deploy -c config/deploy.ci.yml
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
      - name: Backend redeploy guidance
        if: ${{ inputs.redeploy && inputs.service != 'web' }}
        run: |
          echo "::notice::backend 重部署请 rerun main 的 Deploy run（gh run rerun <id> --failed）——本通道仅负责解锁与 web 重部署（backend 部署在本通道缺业务 secrets，刻意不复刻）"
